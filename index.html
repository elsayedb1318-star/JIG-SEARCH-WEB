<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIG SEARCH</title>
<style>
  :root{
    --blue:#1a56db;
    --blue-dark:#1442a8;
    --bg:#eef1f6;
    --card:#ffffff;
    --border:#d9dee6;
    --text:#1f2430;
    --muted:#6b7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .header{
    width:100%;
    background:var(--card);
    padding:36px 20px 28px;
    box-shadow:0 2px 10px rgba(20,30,60,.06);
    border-bottom-left-radius:28px;
    border-bottom-right-radius:28px;
  }
  .title{
    text-align:center;
    font-size:32px;
    font-weight:800;
    letter-spacing:1px;
    color:var(--blue);
    margin:0 0 24px;
    font-family:Tahoma, Arial, sans-serif;
  }
  .search-box{
    max-width:520px;
    margin:0 auto;
  }
  input#q{
    width:100%;
    padding:16px 18px;
    font-size:16px;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    background:#fff;
    text-align:right;
  }
  input#q:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(26,86,219,.15);
  }
  button#searchBtn{
    width:100%;
    margin-top:14px;
    padding:16px;
    font-size:18px;
    font-weight:600;
    color:#fff;
    background:var(--blue);
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:background .15s ease;
  }
  button#searchBtn:hover{ background:var(--blue-dark); }
  button#searchBtn:disabled{ background:#9db4e8; cursor:default; }
  .powered{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-top:16px;
  }
  .content{
    width:100%;
    max-width:640px;
    padding:22px 16px 60px;
  }
  .status{
    text-align:center;
    color:var(--muted);
    margin-top:24px;
    font-size:15px;
  }
  .results{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:8px;
  }
  .result-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    text-decoration:none;
    color:var(--text);
  }
  .result-item:hover{ border-color:var(--blue); }
  .file-icon{
    flex:0 0 auto;
    width:36px;height:36px;
    border-radius:8px;
    background:#fde8e8;
    color:#c0392b;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
  }
  .file-name{
    flex:1;
    font-size:15px;
    word-break:break-word;
    text-align:right;
  }
  .load-more{
    display:block;
    margin:16px auto 0;
    padding:10px 22px;
    background:#fff;
    border:1px solid var(--blue);
    color:var(--blue);
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
  }
  .setup-warning{
    max-width:640px;
    margin:18px auto 0;
    background:#fff7e6;
    border:1px solid #ffd591;
    color:#8a5b00;
    border-radius:10px;
    padding:14px 16px;
    font-size:13.5px;
    line-height:1.7;
    text-align:right;
  }
  .setup-warning code{
    background:#fff1d1;
    padding:1px 5px;
    border-radius:4px;
    direction:ltr;
    unicode-bidi:embed;
  }
</style>
</head>
<body>

  <div class="header">
    <h1 class="title">JIG SEARCH</h1>
    <div class="search-box">
      <input type="text" id="q" placeholder="connector or order number" />
      <button id="searchBtn">بحث</button>
    </div>
    <div class="powered">Powered by Elsayed adel</div>
  </div>

  <div class="content">
    <div id="setupWarning" class="setup-warning" style="display:none;"></div>
    <div id="status" class="status"></div>
    <div id="results" class="results"></div>
    <button id="loadMoreBtn" class="load-more" style="display:none;">تحميل المزيد</button>
  </div>

<script>
  // =========================================================
  // إعدادات لازم تتظبط قبل ما الصفحة تشتغل:
  // =========================================================
  const API_KEY = "AIzaSyC7F7fO9WYl7Qzt0Zl45Mk04XlZuoOJ4uo"; // <-- حط الـ API Key هنا
  const ROOT_FOLDER_ID = "1m0jhTeU8PtiaFu9G_mzH_NxLD-IayaR-"; // ID الفولدر الرئيسي
  const PAGE_SIZE = 30;
  const FOLDER_CHUNK_SIZE = 20; // عدد الفولدرات في كل استعلام بحث واحد
  const CACHE_KEY = 'jigsearch_folder_index_v1';
  const CACHE_TTL_MS = 24 * 60 * 60 * 1000; // 24 ساعة
  // =========================================================

  const qInput = document.getElementById('q');
  const searchBtn = document.getElementById('searchBtn');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const setupWarning = document.getElementById('setupWarning');

  let allFolderIds = null;      // كل الفولدرات (شامل الرئيسي) بعد الفهرسة
  let currentQuery = "";
  let pendingChunks = [];       // الشنكات اللي لسه محتاجين نبحث فيها للصفحة الحالية
  let chunkPageTokens = {};     // nextPageToken لكل شنك لو فيه صفحات زيادة
  let displayedCount = 0;

  function checkSetup(){
    if(!API_KEY || API_KEY === "YOUR_GOOGLE_API_KEY_HERE"){
      setupWarning.style.display = "block";
      setupWarning.innerHTML =
        "⚠️ لسه محتاج تحط الـ Google API Key عشان البحث يشتغل.<br>" +
        "افتح ملف الصفحة، دوّر على المتغيّر <code>API_KEY</code>، وحطّ فيه الكود من Google Cloud Console.<br>" +
        "وتأكد إن الفولدر معمول له مشاركة \"Anyone with the link – Viewer\".";
      searchBtn.disabled = true;
      return false;
    }
    setupWarning.style.display = "none";
    return true;
  }

  function escapeForDriveQuery(str){
    return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  async function driveList(q, pageToken){
    const url = new URL('https://www.googleapis.com/drive/v3/files');
    url.searchParams.set('q', q);
    url.searchParams.set('fields', 'nextPageToken, files(id, name, webViewLink, mimeType)');
    url.searchParams.set('pageSize', '1000');
    url.searchParams.set('key', API_KEY);
    url.searchParams.set('supportsAllDrives', 'true');
    url.searchParams.set('includeItemsFromAllDrives', 'true');
    if(pageToken) url.searchParams.set('pageToken', pageToken);
    const res = await fetch(url.toString());
    const data = await res.json();
    if(data.error) throw new Error(data.error.message || 'خطأ غير معروف من Google Drive');
    return data;
  }

  // بيدور على كل الفولدرات الفرعية جوه فولدر معين، من كل المستويات (BFS)
  async function crawlAllFolders(rootId, onProgress){
    const all = [rootId];
    let queue = [rootId];
    let level = 0;
    while(queue.length){
      const nextQueue = [];
      for(const folderId of queue){
        let pageToken = null;
        do{
          const q = `'${folderId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
          const data = await driveList(q, pageToken);
          (data.files || []).forEach(f => { all.push(f.id); nextQueue.push(f.id); });
          pageToken = data.nextPageToken || null;
        } while(pageToken);
      }
      queue = nextQueue;
      level++;
      if(onProgress) onProgress(all.length, level);
      if(level > 15) break; // حماية من حلقات لا نهائية
    }
    return all;
  }

  function loadCachedIndex(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(parsed.rootId !== ROOT_FOLDER_ID) return null;
      if(Date.now() - parsed.ts > CACHE_TTL_MS) return null;
      return parsed.folderIds;
    }catch(e){ return null; }
  }

  function saveCachedIndex(folderIds){
    try{
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        rootId: ROOT_FOLDER_ID, ts: Date.now(), folderIds
      }));
    }catch(e){ /* تجاهل لو التخزين ممتلئ */ }
  }

  async function ensureIndex(forceRefresh){
    if(allFolderIds && !forceRefresh) return allFolderIds;

    if(!forceRefresh){
      const cached = loadCachedIndex();
      if(cached && cached.length){
        allFolderIds = cached;
        return allFolderIds;
      }
    }

    statusEl.textContent = "بيتم تجهيز فهرس الفولدرات لأول مرة... (هيتم مرة واحدة بس ويتخزن)";
    searchBtn.disabled = true;
    try{
      allFolderIds = await crawlAllFolders(ROOT_FOLDER_ID, (count, level) => {
        statusEl.textContent = `بيتم فهرسة الفولدرات... تم إيجاد ${count} فولدر (مستوى ${level})`;
      });
      saveCachedIndex(allFolderIds);
      statusEl.textContent = "";
    }catch(err){
      statusEl.textContent = "حصل خطأ أثناء الفهرسة: " + err.message;
      allFolderIds = null;
    }finally{
      searchBtn.disabled = false;
    }
    return allFolderIds;
  }

  function chunkArray(arr, size){
    const out = [];
    for(let i=0; i<arr.length; i+=size) out.push(arr.slice(i, i+size));
    return out;
  }

  function fileIconLabel(){ return 'PDF'; }

  function renderFiles(files){
    files.forEach(f => {
      const a = document.createElement('a');
      a.className = 'result-item';
      a.href = f.webViewLink || `https://drive.google.com/file/d/${f.id}/view`;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `
        <div class="file-icon">${fileIconLabel()}</div>
        <div class="file-name">${f.name}</div>
      `;
      resultsEl.appendChild(a);
      displayedCount++;
    });
  }

  // بيدور على أول صفحة نتائج مطابقة من كل شنك، وبيرجع لحد ما يوصل PAGE_SIZE أو يخلص الشنكات
  async function searchNextBatch(){
    const safeTerm = escapeForDriveQuery(currentQuery);
    let collected = [];

    while(pendingChunks.length && collected.length < PAGE_SIZE){
      const chunk = pendingChunks[0];
      const parentsClause = chunk.map(id => `'${id}' in parents`).join(' or ');
      const q = `(${parentsClause}) and mimeType = 'application/pdf' and trashed = false and name contains '${safeTerm}'`;
      const pageToken = chunkPageTokens[chunk.join(',')] || null;

      const data = await driveList(q, pageToken);
      const files = data.files || [];
      collected = collected.concat(files);

      if(data.nextPageToken){
        chunkPageTokens[chunk.join(',')] = data.nextPageToken;
      } else {
        pendingChunks.shift(); // خلصنا من الشنك ده
      }
    }
    return collected;
  }

  async function runSearch(reset){
    const term = qInput.value.trim();
    if(!term){
      statusEl.textContent = "اكتب اسم أو جزء من اسم الملف الأول";
      return;
    }
    if(!checkSetup()) return;

    const folderIds = await ensureIndex(false);
    if(!folderIds) return;

    if(reset){
      currentQuery = term;
      resultsEl.innerHTML = "";
      displayedCount = 0;
      pendingChunks = chunkArray(folderIds, FOLDER_CHUNK_SIZE);
      chunkPageTokens = {};
    }

    statusEl.textContent = "بحث جاري...";
    searchBtn.disabled = true;
    loadMoreBtn.style.display = "none";

    try{
      const files = await searchNextBatch();

      if(reset && files.length === 0 && displayedCount === 0){
        statusEl.textContent = "مفيش نتايج مطابقة";
      } else {
        statusEl.textContent = "";
      }

      renderFiles(files);
      loadMoreBtn.style.display = pendingChunks.length ? 'block' : 'none';
    }catch(err){
      statusEl.textContent = "حصل خطأ: " + err.message;
    }finally{
      searchBtn.disabled = false;
    }
  }

  searchBtn.addEventListener('click', () => runSearch(true));
  qInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') runSearch(true); });
  loadMoreBtn.addEventListener('click', () => runSearch(false));

  checkSetup();
  // بدء الفهرسة فورًا في الخلفية عشان أول بحث يبقى سريع
  ensureIndex(false);
</script>
</body>
</html>
