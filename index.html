  importantLinksBtn.addEventListener('click', () => { closeAdvancedMenu(); linksModalOverlay.style.display = 'flex'; });
  linksModalClose.addEventListener('click', closeLinksModal);
  linksModalOverlay.addEventListener('click', (e) => { if(e.target === linksModalOverlay) closeLinksModal(); });

  // اقتراحات أثناء الكتابة - مبنية على أسماء الملفات في الفهرس المحلي
  // نفسه (من غير أي طلب شبكة إضافي)
  function updateSearchSuggestions(){
    const query = qInput.value.trim().toLowerCase();
    if(query.length < 2 || !indexedFiles || !indexedFiles.length){
      searchSuggestions.style.display = 'none';
      searchSuggestions.innerHTML = '';
      return;
    }
    const seen = new Set();
    const matches = [];
    for(const f of indexedFiles){
      if(matches.length >= 6) break;
      const name = f.name || '';
      if(name.toLowerCase().includes(query) && !seen.has(name)){
        seen.add(name);
        matches.push(f);
      }
    }
    if(!matches.length){
      searchSuggestions.style.display = 'none';
      searchSuggestions.innerHTML = '';
      return;
    }
    searchSuggestions.innerHTML = '';
    matches.forEach(f => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'search-suggestion-item';
      btn.textContent = f.name || '';
      btn.addEventListener('click', async () => {
        qInput.value = f.name || '';
        qClear.style.display = 'flex';
        searchSuggestions.style.display = 'none';
        await openFileDirect(f, btn);
      });
      searchSuggestions.appendChild(btn);
    });
    searchSuggestions.style.display = 'block';
  }

  searchBtn.addEventListener('click', runSearch);
  qSearchIcon.addEventListener('click', () => {
    searchSuggestions.style.display = 'none';
    runSearch();
  });
  qInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') runSearch();
    if(e.key === 'Escape') searchSuggestions.style.display = 'none';
  });
  // البحث بيتم بس لما تدوس زرار "بحث" أو Enter - مفيش بحث تلقائي أثناء الكتابة
  // اقتراحات البحث بس بتتأخر شوية (debounce) عشان الكتابة السريعة على الموبايل
  // ماتشغلش الفلترة كذا مرة فاضية على كل حرف
  let suggestionsDebounceTimer = null;
  qInput.addEventListener('input', () => {
    qClear.style.display = qInput.value ? 'flex' : 'none';
    clearTimeout(suggestionsDebounceTimer);
    suggestionsDebounceTimer = setTimeout(updateSearchSuggestions, 120);
    if(qInput.value.trim() === ""){
      searchSuggestions.style.display = 'none';
      searchSuggestions.innerHTML = '';
      resultsEl.innerHTML = "";
      currentFiles = [];
      renderedCount = 0;
      loadMoreBtn.style.display = "none";
      setStatus("");
    }
  });
  qInput.addEventListener('focus', updateSearchSuggestions);
  document.addEventListener('click', (e) => {
    if(!e.target.closest('.search-box')) searchSuggestions.style.display = 'none';
  });
  qClear.addEventListener('click', () => {
    qInput.value = "";
    qClear.style.display = 'none';
    searchSuggestions.style.display = 'none';
    searchSuggestions.innerHTML = '';
    resultsEl.innerHTML = "";
    currentFiles = [];
    renderedCount = 0;
    loadMoreBtn.style.display = "none";
    setStatus("");
    qInput.focus();
  });

  loadMoreBtn.addEventListener('click', () => {
    showResultsPage(currentFiles, true);
  });

  let isReindexing = false;
  async function runManualReindex(){
    if(isReindexing) return;
    isReindexing = true;
    statusContainer.style.cursor = 'default';
    newFilesBanner.style.display = 'none';
    resultsEl.innerHTML = "";
    currentFiles = [];
    renderedCount = 0;
    loadMoreBtn.style.display = "none";
    await ensureIndex(true); // forceRefresh = true
    isReindexing = false;
    statusContainer.style.cursor = 'pointer';
  }
  statusContainer.addEventListener('click', runManualReindex);
  newFilesBanner.addEventListener('click', runManualReindex);

  // ===== مزامنة تلقائية صامتة (فهرسة تفاضلية): كل ما تُعمل عملية بحث (بحد
  // أقصى مرة كل NEW_FILES_SYNC_COOLDOWN_MS)، بنسأل Drive عن أي ملفات
  // جديدة/معدّلة في أي فولدر معروف بالفعل (حتى الفرعي العميق) بعد آخر
  // مزامنة، ونضيفها مباشرة لفهرس البحث المحلي وللكاش - من غير ما تدوس أي
  // زرار ومن غير ما نعيد فهرسة كل حاجة من الأول. لو الملف الجديد كان بيدور
  // عليه بحث شغال حاليًا، النتايج بتتحدث تلقائيًا كمان.
  // نفس الاستعلام بيرجّع كمان أي فولدر جديد اتعمل بعد آخر مزامنة (modifiedTime
  // بتتحسب من وقت الإنشاء)، فبنكتشف الفولدرات الجديدة ونعمل لها فهرسة كاملة
  // لمحتواها بس (مش لكل الدرايف) ونضيفها لنفس فهرس البحث.
  const NEW_FILES_SYNC_COOLDOWN_MS = 45 * 1000;
  let lastSyncTs = 0;
  let isSyncingNewFiles = false;
  let lastSyncStats = { added: 0, updated: 0, removed: 0 };
  function getLastSyncStats(){ return { ...lastSyncStats }; }
  async function syncNewFiles(){
    if(isSyncingNewFiles) return false;
    if(!allFolderIds || !indexedFiles) return false;
    if(Date.now() - lastSyncTs < NEW_FILES_SYNC_COOLDOWN_MS) return false;
    const cached = await loadCachedIndex();
    if(!cached || !cached.ts) return false;
    isSyncingNewFiles = true;
    const syncStartedAt = Date.now();
    try{
      const isoTs = new Date(cached.ts).toISOString().replace(/\.\d{3}Z$/, 'Z');
      const ids = allFolderIds;
      const knownFilesById = new Map(indexedFiles.map(f => [f.id, f]));
      const knownFolderIds = new Set(allFolderIds);
      const newFiles = [];
      const newFolders = []; // { id, topFolderId } - فولدرات جديدة تمامًا لسه محتاجة فهرسة لمحتواها
      const removedFileIds = new Set(); // ملفات اتحذفت/اتنقلت للسلة
      const removedFolderIds = new Set(); // فولدرات اتحذفت/اتنقلت للسلة
      let renamedCount = 0;
      let updatedCount = 0;
      let i = 0;
      const CONCURRENCY = 6;
      async function worker(){
        while(i < ids.length){
          const folderId = ids[i++];
          // من غير "trashed = false" هنا عمدًا - محتاجين نشوف العناصر اللي
          // اتنقلت للسلة كمان (trashed:true) عشان نشيلها من الفهرس المحلي
          const q = `'${folderId}' in parents and modifiedTime > '${isoTs}'`;
          try{
            let pageToken = null;
            do{
              const data = await driveList(q, pageToken, 1); // retry واحدة بس - فحص خفيف مش حرج
              (data.files || []).forEach(f => {
                if(f.mimeType === 'application/vnd.google-apps.folder'){
                  if(f.trashed){
                    if(knownFolderIds.has(f.id)) removedFolderIds.add(f.id);
                  }else if(!knownFolderIds.has(f.id)){
                    const topFolderId = folderTopMap[folderId] !== undefined ? folderTopMap[folderId] : folderId;
                    newFolders.push({ id: f.id, topFolderId });
                    knownFolderIds.add(f.id);
                  }
                }else if(SUPPORTED_MIME_TYPES[f.mimeType]){
                  const existing = knownFilesById.get(f.id);
                  if(f.trashed){
                    if(existing) removedFileIds.add(f.id);
                  }else if(existing){
                    // نفس الملف معروف بالفعل - نتأكد لو اسمه اتغيّر (rename)
                    if(existing.name !== f.name){
                      existing.name = f.name;
                      prepareSearchIndex([existing]);
                      renamedCount++;
                    }
                  }else{
                    newFiles.push({
                      id: f.id, name: f.name, type: SUPPORTED_MIME_TYPES[f.mimeType], mt: f.modifiedTime || null,
                      folder: folderTopMap[folderId] !== undefined ? folderTopMap[folderId] : null
                    });
                    knownFilesById.set(f.id, newFiles[newFiles.length - 1]);
                  }
                }
              });
              pageToken = data.nextPageToken || null;
            }while(pageToken);
          }catch(e){
            // فولدر واحد فشل (صلاحيات/شبكة) - نتخطاه ونكمل الباقي، ده فحص خفيف مش فهرسة كاملة
          }
        }
      }
      const workers = [];
      for(let k = 0; k < Math.min(CONCURRENCY, ids.length); k++) workers.push(worker());
      await Promise.all(workers);

      // فهرسة محتوى أي فولدر جديد اتكتشف - فهرسة كاملة لشجرته هو بس، مش لكل
      // الدرايف من الأول، فده لسه فهرسة تفاضلية أسرع بكتير من REFRESH كامل
      const newFolderIds = [];
      for(const nf of newFolders){
        try{
          // بنستخدم nf.id كـ "روت" لفهرسة فرعية لشجرته هو بس، لكن كل ملف/فولدر
          // جواه لازم ينسب لنفس الفولدر الرئيسي (nf.topFolderId) اللي المستخدم
          // بيفلتر بيه في الواجهة - مش لـ nf.id نفسه
          const sub = await crawlAllFoldersAndFiles(nf.id);
          newFolderIds.push(nf.id, ...sub.folderIds.filter(id => id !== nf.id));
          folderTopMap[nf.id] = nf.topFolderId;
          sub.folderIds.filter(id => id !== nf.id).forEach(id => { folderTopMap[id] = nf.topFolderId; });
          newFiles.push(...sub.files.map(f => ({ ...f, folder: nf.topFolderId })));
        }catch(e){
          // فولدر جديد فشلت فهرسته - هنحاول تاني في المزامنة الجاية أو مع REFRESH يدوي
        }
      }
      if(newFolderIds.length){
        allFolderIds = allFolderIds.concat(newFolderIds);
      }

      // فولدر اتحذف: بنشيله هو وأي ملف كان متبع ليه (folder=topFolderId) -
      // ملحوظة: فولدرات فرعية جوه الفولدر المحذوف مش بتتحدث حالتها هي نفسها
      // (Drive مابيحدّثش modifiedTime بتاعها لما الأب يتحذف)، فهتفضل شايلة
      // مكان في allFolderIds لحد أول REFRESH كامل - ده تحديد بسيط ومش خطير
      // (هيرجع فحص فاضي بس مش هيبوّظ حاجة)
      if(removedFolderIds.size){
        allFolderIds = allFolderIds.filter(id => !removedFolderIds.has(id));
        indexedFiles = indexedFiles.filter(f => !removedFolderIds.has(f.folder));
      }
      if(removedFileIds.size){
        indexedFiles = indexedFiles.filter(f => !removedFileIds.has(f.id));
        removedFileIds.forEach(id => deleteCachedFile(id));
      }

      lastSyncTs = syncStartedAt;
      const changed = newFiles.length || removedFileIds.size || removedFolderIds.size || renamedCount;
      if(changed){
        prepareSearchIndex(newFiles);
        indexedFiles = indexedFiles.concat(newFiles);
        await saveCachedIndex(allFolderIds, indexedFiles, allTopFolders, folderTopMap);
        return true;
      }
      return false;
    }catch(e){
      return false;
    }finally{
      isSyncingNewFiles = false;
    }
  }

  // ===== تنظيف تلقائي خفيف: مرة كل 24 ساعة، ويختبر فقط Recent/Favorites =====
  const AUTO_CLEANUP_KEY = 'jigsearch_auto_cleanup_ts_v1';
  const AUTO_CLEANUP_INTERVAL_MS = 24 * 60 * 60 * 1000;
  let autoCleanupRunning = false;
  async function runAutomaticCleanup(){
    if(autoCleanupRunning || navigator.onLine === false) return;
    let last = 0;
    try{ last = Number(localStorage.getItem(AUTO_CLEANUP_KEY) || 0); }catch(e){}
    if(Date.now() - last < AUTO_CLEANUP_INTERVAL_MS) return;
    autoCleanupRunning = true;
    try{
      const combined = [...getFavoriteFiles(), ...getRecentFiles()];
      const seen = new Set();
      const toCheck = combined.filter(f => { if(seen.has(f.id)) return false; seen.add(f.id); return true; });
      let removed = 0, i = 0;
      const CONCURRENCY = 3;
      async function worker(){
        while(i < toCheck.length){
          const f = toCheck[i++];
          const status = await checkFileExists(f.id);
          if(status === 'gone'){ await handleFileGone(f); removed++; }
        }
      }
      await Promise.all(Array.from({length: Math.min(CONCURRENCY, toCheck.length)}, worker));
      try{ localStorage.setItem(AUTO_CLEANUP_KEY, String(Date.now())); }catch(e){}
      if(removed){
        setStatusKey('autoCleanupDone', {count: removed});
        if(activeHomeTab === 'recent') renderRecentTab();
        else if(activeHomeTab === 'favorites') renderFavoritesTab();
      }
    }catch(e){ /* التنظيف التلقائي لا يعطّل التطبيق */ }
    finally{ autoCleanupRunning = false; }
  }

  // ===== لو المستخدم حدد/نسخ أي كلمة في أي مكان في الصفحة، بيظهرله شريط
  // صغير يسأله "هل تريد البحث؟" مع إمكانية تعديل النص قبل البحث =====
  let selectionCheckTimer = null;
  document.addEventListener('selectionchange', () => {
    clearTimeout(selectionCheckTimer);
    selectionCheckTimer = setTimeout(() => {
      const sel = window.getSelection();
      const text = sel ? sel.toString().trim() : '';
      if(text && text.length > 0 && text.length < 300){
        selectionSearchInput.value = text;
        selectionSearchBar.style.display = 'flex';
      }else{
        selectionSearchBar.style.display = 'none';
      }
    }, 200);
  });
  selectionSearchGo.addEventListener('click', () => {
    const val = selectionSearchInput.value.trim();
    selectionSearchBar.style.display = 'none';
    window.getSelection().removeAllRanges();
    if(val){
      qInput.value = val;
      qClear.style.display = 'flex';
      runSearch();
    }
  });
  selectionSearchClose.addEventListener('click', () => {
    selectionSearchBar.style.display = 'none';
    window.getSelection().removeAllRanges();
  });

  // فحص خفيف (مزامنة تفاضلية) لملفات/فولدرات جديدة، وتحديث النتايج المعروضة
  // حاليًا لو كان فيه بحث شغال، من غير ما يوقف المستخدم أو يحتاج يدوس زرار
  const NEW_FILES_CHECK_INTERVAL_MS = 60 * 60 * 1000; // كل ساعة طول ما الصفحة مفتوحة
  let newFilesBannerTimer = null;
  async function checkForNewFiles(){
    const found = await syncNewFiles();
    if(found){
      if(qInput.value.trim()) runSearch();
      // بانر بسيط بيظهر ويختفي لوحده - مجرد تأكيد إن الفهرس اتحدث تلقائيًا،
      // مش محتاج المستخدم يدوس عليه (المزامنة أصلًا حصلت من غير أي تدخل منه)
      newFilesBanner.style.display = 'flex';
      clearTimeout(newFilesBannerTimer);
      newFilesBannerTimer = setTimeout(() => { newFilesBanner.style.display = 'none'; }, 6000);
    }
    return found;
  }

  applyLanguage(currentLang);
  // أول ما الصفحة تفتح: استخدم الفهرس المحفوظ لو موجود، ولو مفيش يعمل فهرسة
  // تلقائية أول مرة بس (مفيش تحديث تلقائي دوري كامل للفهرس القديم بعد كده -
  // بس فيه مزامنة تفاضلية دورية خفيفة تحت)
  ensureIndex(false);
  scheduleSilentCleanup();
  updateOfflineIndicator();
  setTimeout(runAutomaticCleanup, 5000);

  window.addEventListener('load', () => {
    // بنستنى شوية عشان الفحص ده ميأثرش خالص على سرعة أول ظهور للصفحة
    setTimeout(checkForNewFiles, 2000);
    setInterval(checkForNewFiles, NEW_FILES_CHECK_INTERVAL_MS);
    setInterval(runAutomaticCleanup, 30 * 60 * 1000);
  });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    // بيفضل نفس الصفحة شغالة بكود JS قديم في الذاكرة حتى بعد ما نسخة جديدة
    // من sw.js تتفعّل (لأنها بتاخد الحكم فورًا - skipWaiting/clients.claim -
    // من غير ما تستنى الصفحة تتقفل)، فلازم نظهر بانر يطلب من المستخدم يعمل
    // تحديث (reload) عشان الكود الشغال دلوقتي يتغيّر فعليًا للنسخة الجديدة.
    // hadController=false في أول تحميل عادي (تسجيل SW لأول مرة) - مش نعتبرها
    // "تحديث"، بنستنى أول controllerchange بعد كده بس
    let hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(hadController && !reloading){
        appUpdateBanner.style.display = 'flex';
      }
      hadController = true;
    });
    appUpdateBanner.addEventListener('click', () => {
      reloading = true;
      window.location.reload();
    });
  }
</script>
</body>
