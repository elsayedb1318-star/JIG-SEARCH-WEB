<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIG SEARCH</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a56db">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // بنطبّق الوضع الليلي بدري قبل ما الصفحة تترسم عشان مايحصلش وميض (flash) بلون غلط
  try{
    if(localStorage.getItem('jigsearch_theme') === 'dark') document.documentElement.classList.add('dark');
  }catch(e){ /* تجاهل */ }
</script>
<style>
  :root{
    --blue:#1a56db;
    --blue-dark:#1442a8;
    --blue-light:#4f7fe8;
    --bg:#eef1f6;
    --card:#ffffff;
    --border:#d9dee6;
    --text:#1f2430;
    --muted:#6b7280;
    --shadow-sm:0 1px 3px rgba(20,30,60,.06), 0 1px 2px rgba(20,30,60,.04);
    --shadow-md:0 6px 20px rgba(20,30,60,.08);
    --shadow-lg:0 12px 32px rgba(20,30,60,.14);
  }
  html.dark{
    --blue:#5b9dff;
    --blue-dark:#3f7fe0;
    --blue-light:#7fb3ff;
    --bg:#0f1218;
    --card:#1b1f29;
    --border:#2f3648;
    --text:#eef1f7;
    --muted:#a3aec2;
    --shadow-sm:0 1px 3px rgba(0,0,0,.35);
    --shadow-md:0 6px 20px rgba(0,0,0,.4);
    --shadow-lg:0 14px 36px rgba(0,0,0,.5);
  }
  html.dark body{ background:var(--bg); }
  html.dark .file-icon{ background:#242a38; }
  html.dark .search-highlight{ background:#5a4a12; color:#ffe9a8; }
  *{box-sizing:border-box;}
  html,body{ overflow-x:hidden; max-width:100%; }
  body{
    margin:0;
    font-family:'Inter', 'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-font-smoothing:antialiased;
  }
  .header{
    width:100%;
    background:linear-gradient(160deg, var(--card) 0%, var(--card) 55%, rgba(26,86,219,.06) 100%);
    padding:40px 20px 30px;
    box-shadow:var(--shadow-sm);
    border-bottom-left-radius:32px;
    border-bottom-right-radius:32px;
    position:relative;
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:0 0 26px;
  }
  .brand-icon{
    width:38px;
    height:38px;
    border-radius:11px;
    background:linear-gradient(135deg, var(--blue) 0%, var(--blue-light) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 12px rgba(26,86,219,.35);
    flex:0 0 auto;
  }
  .brand-icon svg{ width:20px; height:20px; }
  .title{
    text-align:center;
    font-size:28px;
    font-weight:800;
    letter-spacing:.5px;
    color:var(--text);
    margin:0;
    font-family:'Inter', Tahoma, Arial, sans-serif;
  }
  .search-box{
    max-width:520px;
    margin:0 auto;
  }
  .search-input-wrap{
    position:relative;
  }
  .search-input-icon{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    color:var(--muted);
    pointer-events:none;
    display:flex;
  }
  input#q{
    width:100%;
    padding:16px 42px 16px 44px;
    font-size:16px;
    font-family:inherit;
    border:1px solid var(--border);
    border-radius:14px;
    outline:none;
    text-align:center;
    border-color:var(--blue);
    background:var(--card);
    color:var(--text);
    box-shadow:0 0 0 3px rgba(26,86,219,.12);
    transition:box-shadow .15s ease;
  }
  input#q:focus{ box-shadow:0 0 0 4px rgba(26,86,219,.2); }
  .q-clear-btn{
    position:absolute;
    top:50%;
    right:10px;
    transform:translateY(-50%);
    width:26px;height:26px;
    border:none;
    border-radius:50%;
    background:#e4e7ee;
    color:#4a5468;
    font-size:13px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .q-clear-btn:hover{ background:#d5d9e2; }
  html.dark .q-clear-btn{ background:#2b3142; color:var(--text); }
  html.dark .q-clear-btn:hover{ background:#3a4152; }
  button#searchBtn{
    width:100%;
    margin-top:14px;
    padding:15px;
    font-size:16px;
    font-weight:600;
    font-family:inherit;
    color:#fff;
    background:linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
    border:none;
    border-radius:14px;
    cursor:pointer;
    letter-spacing:.2px;
    box-shadow:0 6px 16px rgba(26,86,219,.28);
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  button#searchBtn:hover{ transform:translateY(-1px); box-shadow:0 8px 20px rgba(26,86,219,.35); }
  button#searchBtn:active{ transform:translateY(0); }
  button#searchBtn:disabled{ background:#9db4e8; box-shadow:none; cursor:default; transform:none; }
  .pdf-search-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    margin:10px auto 0;
    color:var(--muted);
    font-size:12.5px;
    user-select:none;
    cursor:pointer;
  }
  .pdf-search-toggle input{
    width:15px;
    height:15px;
    margin:0;
    accent-color:var(--blue);
    cursor:pointer;
  }
  .search-suggestions{
    position:relative;
    z-index:25;
    margin-top:7px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow-md);
    overflow:hidden;
    text-align:left;
  }
  .search-suggestion{
    display:block;
    width:100%;
    border:0;
    border-bottom:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    padding:10px 13px;
    font:13px inherit;
    text-align:left;
    cursor:pointer;
  }
  .search-suggestion:last-child{ border-bottom:0; }
  .search-suggestion:hover,.search-suggestion.active{ background:rgba(26,86,219,.08); color:var(--blue-dark); }
  .pdf-search-progress{
    display:inline-block;
    margin-inline-start:5px;
    color:var(--blue);
  }
  .powered{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-top:18px;
  }
  .help-btn{ color:#3a4152; }
  html.dark .help-btn{ color:var(--text); }
  .search-highlight{
    background:#fff3b0;
    color:inherit;
    padding:0 1px;
    border-radius:2px;
  }
  .help-modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid var(--border);
  }
  .help-modal-header h2{
    margin:0;
    font-size:17px;
    color:var(--blue);
  }
  .help-modal-close{
    border:none;
    background:var(--bg);
    color:var(--muted);
    width:30px;height:30px;
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    cursor:pointer;
    flex:0 0 auto;
    transition:background .12s ease;
  }
  html.dark .help-modal-close{ background:var(--border); }
  .help-modal-close:hover{ background:var(--border); }
  .content{
    width:100%;
    max-width:640px;
    padding:26px 16px 60px;
  }
  .status{
    text-align:center;
    color:var(--muted);
    margin-top:28px;
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
    border-radius:12px;
    padding:6px 10px;
    transition:background .12s ease;
  }
  .status:hover{ background:rgba(26,86,219,.06); }
  html.dark .status:hover{ background:rgba(255,255,255,.05); }
  .status.status-error{
    color:#c0392b;
    font-weight:600;
  }
  .results{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:8px;
  }
  .result-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 16px;
    text-decoration:none;
    color:var(--text);
    max-width:100%;
    box-shadow:var(--shadow-sm);
    transition:transform .12s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .result-item:hover{ border-color:var(--blue-light); box-shadow:var(--shadow-md); transform:translateY(-2px); }
  .result-item.is-opening{ opacity:.55; pointer-events:none; }
  .result-item:active{ transform:translateY(0); }
  .file-icon{
    flex:0 0 auto;
    width:38px;height:38px;
    border-radius:10px;
    background:#fde8e8;
    color:#c0392b;
    display:flex;align-items:center;justify-content:center;
  }
  .file-icon svg{ width:19px; height:19px; }
  .file-icon.xls{
    background:#e5f5ea;
    color:#1e7b3e;
  }
  .file-icon.doc{
    background:#e6edfb;
    color:#1a56db;
  }
  .file-icon.ppt{
    background:#fdeee0;
    color:#c0611b;
  }
  .file-icon.img{
    background:#f3e8fd;
    color:#7e22ce;
  }
  .file-icon.custom{
    background:var(--card);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .file-name{
    flex:1;
    min-width:0;
    overflow-wrap:anywhere;
    word-break:break-all;
    font-size:14.5px;
  }
  .load-more{
    text-align:center;
    display:block;
    margin:18px auto 0;
    padding:11px 24px;
    background:var(--card);
    border:1px solid var(--blue);
    color:var(--blue);
    border-radius:999px;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    font-family:inherit;
    transition:background .15s ease, transform .12s ease;
  }
  .load-more:hover{ background:rgba(26,86,219,.08); transform:translateY(-1px); }
  .setup-warning{
    max-width:640px;
    margin:18px auto 0;
    background:#fff7e6;
    border:1px solid #ffd591;
    color:#8a5b00;
    border-radius:10px;
    padding:14px 16px;
    font-size:13.5px;
    line-height:1.7;
    text-align:center;
  }
  .setup-warning code{
    background:#fff1d1;
    padding:1px 5px;
    border-radius:4px;
    direction:ltr;
    unicode-bidi:embed;
  }
  .new-files-banner{
    display:block;
    width:100%;
    max-width:520px;
    margin:16px auto 0;
    padding:12px 16px;
    background:linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    border:none;
    color:#fff;
    font-size:14px;
    font-weight:600;
    font-family:inherit;
    border-radius:14px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(22,163,74,.3);
    animation:banner-in .25s ease;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .new-files-banner:hover{ transform:translateY(-1px); box-shadow:0 8px 20px rgba(22,163,74,.38); }
  @keyframes banner-in{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }
  .selection-search-bar{
    position:fixed;
    left:12px;
    right:12px;
    bottom:16px;
    z-index:60;
    display:flex;
    align-items:center;
    gap:8px;
    max-width:520px;
    margin:0 auto;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:10px;
    box-shadow:var(--shadow-lg);
    animation:banner-in .2s ease;
  }
  .selection-search-input{
    flex:1;
    min-width:0;
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 10px;
    font-size:14px;
    font-family:inherit;
    background:var(--bg);
    color:var(--text);
  }
  .selection-search-go{
    flex:0 0 auto;
    background:linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:9px 14px;
    font-size:13.5px;
    font-weight:600;
    font-family:inherit;
    white-space:nowrap;
    cursor:pointer;
  }
  .selection-search-close{
    flex:0 0 auto;
    width:34px;height:34px;
    border:none;
    background:var(--bg);
    color:var(--muted);
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    cursor:pointer;
  }
  .spinner{
    display:none;
    width:18px;
    height:18px;
    border:3px solid #c9d4e8;
    border-top-color:var(--blue);
    border-radius:50%;
    animation:spin .7s linear infinite;
    flex:0 0 auto;
  }
  .spinner.active{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .skeleton-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:16px;
  }
  .skeleton-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 16px;
  }
  .skeleton-icon{
    flex:0 0 auto;
    width:38px;height:38px;
    border-radius:10px;
    background:linear-gradient(90deg, var(--border) 25%, rgba(255,255,255,.5) 50%, var(--border) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
  }
  .skeleton-line{
    flex:1;
    height:14px;
    border-radius:7px;
    background:linear-gradient(90deg, var(--border) 25%, rgba(255,255,255,.5) 50%, var(--border) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
  }
  html.dark .skeleton-icon, html.dark .skeleton-line{
    background:linear-gradient(90deg, var(--border) 25%, rgba(255,255,255,.08) 50%, var(--border) 75%);
    background-size:200% 100%;
  }
  @keyframes shimmer{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }
  .recent-searches{
    max-width:520px;
    margin:12px auto 0;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .recent-searches-label{
    color:var(--muted);
    font-size:12.5px;
    margin-inline-end:2px;
  }
  .recent-chip-wrap{
    display:inline-flex;
    align-items:center;
    background:#eef2fb;
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
  }
  .recent-chip-wrap:hover{ border-color:var(--blue); }
  .recent-chip{
    background:none;
    border:none;
    color:var(--blue-dark);
    padding:6px 4px 6px 14px;
    font-size:13px;
    cursor:pointer;
    text-align:center;
  }
  .recent-chip-remove{
    background:none;
    border:none;
    color:#9aa3b2;
    padding:6px 12px 6px 6px;
    font-size:15px;
    line-height:1;
    cursor:pointer;
  }
  .recent-chip-remove:hover{ color:#c0392b; }
  .recent-clear-all{
    background:none;
    border:none;
    color:var(--muted);
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:6px 4px;
  }
  .recent-clear-all:hover{ color:#c0392b; }
  .search-tools-row{
    max-width:520px;
    margin:16px auto 0;
    padding:0 4px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex-wrap:nowrap;
  }
  .folder-filter-wrap{
    display:flex;
    align-items:center;
    gap:5px;
    flex-wrap:nowrap;
    justify-content:center;
    min-width:0;
    flex:1 1 auto;
  }
  .folder-filter-label{ font-size:11.5px; color:var(--muted); white-space:nowrap; flex:0 0 auto; }
  .folder-filter-select{
    border:1px solid var(--border);
    border-radius:999px;
    padding:7px 8px;
    font-size:11.5px;
    font-family:inherit;
    background:var(--card);
    color:var(--text);
    width:100%;
    min-width:0;
    max-width:100px;
    text-align:center;
  }
  .advanced-search{ flex:0 0 auto; }
  .list-clear-all-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:10px;
  }
  .remove-btn{ color:#c7ccd6; }
  .remove-btn:hover{ color:#c0392b; }
  .advanced-search{
    position:relative;
    display:flex;
    justify-content:center;
  }
  .advanced-menu{
    position:absolute;
    top:calc(100% + 8px);
    left:50%;
    transform:translateX(-50%);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow-lg);
    overflow:hidden;
    min-width:230px;
    z-index:20;
  }
  .advanced-menu-item{
    display:block;
    width:100%;
    text-align:left;
    background:var(--card);
    border:none;
    padding:13px 16px;
    font-size:13.5px;
    font-family:inherit;
    color:var(--text);
    cursor:pointer;
    transition:background .12s ease;
  }
  .advanced-menu-item:hover{ background:rgba(26,86,219,.08); }
  .advanced-menu-item + .advanced-menu-item{ border-top:1px solid var(--border); }
  .tool-btn{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--blue-dark);
    border-radius:999px;
    padding:9px 16px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    transition:border-color .15s ease, transform .12s ease;
  }
  .tool-btn:hover{ border-color:var(--blue); transform:translateY(-1px); }
  .tool-btn:disabled{ opacity:.55; cursor:default; transform:none; }
  #advancedSearchBtn{ padding:7px 11px; font-size:11.5px; white-space:nowrap; flex:0 0 auto; }
  .home-tabs{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .home-tab{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:999px;
    padding:8px 16px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease, transform .12s ease;
  }
  .home-tab:hover{ border-color:var(--blue); transform:translateY(-1px); }
  .home-tab.active{ background:linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%); border-color:var(--blue); color:#fff; box-shadow:0 4px 12px rgba(26,86,219,.25); }
  .star-btn{
    flex:0 0 auto;
    background:none;
    border:none;
    font-size:19px;
    line-height:1;
    cursor:pointer;
    color:#c7ccd6;
    padding:2px;
  }
  .star-btn.active{ color:#e8a33d; }
  .camera-modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,18,24,.65);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:110;
  }
  .camera-modal{
    background:var(--card);
    border-radius:18px;
    max-width:480px;
    width:100%;
    overflow:hidden;
    box-shadow:var(--shadow-lg);
  }
  .camera-video-wrap{
    position:relative;
    line-height:0;
  }
  .camera-modal video{
    width:100%;
    display:block;
    background:#000;
    max-height:55vh;
  }
  .ocr-guide-box{
    position:absolute;
    left:8%;
    right:8%;
    top:40%;
    height:20%;
    border:2px solid #4ade80;
    border-radius:8px;
    box-shadow:0 0 0 1000px rgba(0,0,0,.35);
    pointer-events:none;
  }
  .ocr-crop-stage{
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    max-height:55vh;
    overflow:hidden;
  }
  .ocr-crop-wrap{
    position:relative;
    max-width:100%;
    max-height:55vh;
    line-height:0;
    touch-action:none;
  }
  .ocr-crop-wrap img{
    display:block;
    max-width:100%;
    max-height:55vh;
    -webkit-user-select:none;
    user-select:none;
    pointer-events:none;
  }
  .crop-box{
    position:absolute;
    border:2px solid #4ade80;
    box-shadow:0 0 0 2000px rgba(0,0,0,.45);
    cursor:move;
    touch-action:none;
  }
  .crop-handle{
    position:absolute;
    width:26px;
    height:26px;
    margin:-13px;
    background:#4ade80;
    border:2px solid #fff;
    border-radius:50%;
    touch-action:none;
  }
  .crop-handle[data-handle="nw"]{ top:0; left:0; cursor:nwse-resize; }
  .crop-handle[data-handle="ne"]{ top:0; right:0; margin-right:-13px; cursor:nesw-resize; }

<script>

  const CACHE_KEY = 'jigsearch_index_v7'; // شامل الفولدرات + أسماء الملفات + الفولدر المباشر لكل ملف (للفلترة)

  const qInput = document.getElementById('q');

  const homeTabsEl = document.getElementById('homeTabs');

  const cameraSearchBtn = document.getElementById('cameraSearchBtn');

  // ===== سجل الملفات المفتوحة والمفضلة - كله محليًا في المتصفح =====
  const RECENT_FILES_KEY = 'jigsearch_recent_files_v1';
  const FAV_KEY = 'jigsearch_favorites_v1';
  const RECENT_FILES_MAX = 30;
  const FILES_CACHE_NAME = 'jigsearch-files-v1';
  const PDF_TEXT_CACHE_PREFIX = 'jigsearch-pdf-text-v1:';
  const PDF_TEXT_MAX_CHARS = 120000;

  // PDF.js is loaded near the bottom of the page. The worker is configured once it exists.
  function configurePdfJs(){
    if(window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      return true;
    }
    return false;
  }

  // بنطلب تخزين دائم عشان المتصفح ميمسحش الملفات المحفوظة تلقائيًا لو
  // الجهاز محتاج مساحة - أفضل جهد بس، مش كل المتصفحات بتدعمها
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(() => {});
  }

  function loadJSON(key, fallback){
    try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ /* تجاهل لو التخزين ممتلئ */ }
  }

  // رابط محتوى الملف نفسه (بايتات الملف) عن طريق الـ Worker - بيرجع CORS
  // صح، فمقدر أقرأ محتواه فعليًا كـ blob وأفتحه مباشرة من غير ما أعدي على
  // صفحة Google Drive نفسها
  function getFileContentUrl(id){
    const url = new URL(PROXY_URL);
    url.searchParams.set('fileId', id);
    return url.toString();
  }
  function openBlob(blob, f){
    const blobUrl = URL.createObjectURL(blob);
    if(f.type === 'pdf' || f.type === 'image'){
      window.open(blobUrl, '_blank', 'noopener');
    } else {
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = f.name || 'file';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
  }
  // بيدور على نسخة محفوظة للملف على الجهاز، ولو لقاها بيفتحها من غير أي
  // اتصال بالإنترنت
  async function tryOpenFromCache(url, f){
    if(!url || !('caches' in window)) return false;
    try{
      const cache = await caches.open(FILES_CACHE_NAME);
      const res = await cache.match(url);
      if(!res) return false;
      const blob = await res.blob();
      if(!blob || !blob.size) return false;
      openBlob(blob, f);
      return true;
    }catch(e){
      return false;
    }
  }
  // بيسحب محتوى الملف من الـ Worker ويفتحه مباشرة (من غير الدخول على صفحة
  // Drive) حتى أول مرة، وبيخزنه كمان للمرة الجاية
  async function tryOpenDirect(url, f){
    if(!url) return false;
    try{
      const res = await fetch(url);
      if(!res.ok) return false;
      const clone = res.clone();
      if('caches' in window){
        caches.open(FILES_CACHE_NAME).then(cache => cache.put(url, clone)).catch(() => {});
      }
      const blob = await res.blob();
      if(!blob || !blob.size) return false;
      openBlob(blob, f);
      return true;
    }catch(e){
      return false;
    }
  }
  function deleteCachedFile(id){
    if(!('caches' in window)) return;
    caches.open(FILES_CACHE_NAME)
      .then(cache => cache.delete(getFileContentUrl(id)))
      .catch(() => {});
  }
  // بيمنع فتح نفس الملف أكتر من مرة في نفس اللحظة (لو المستخدم دوس مرتين
  // بسرعة وهو مستني)
  const openingFileIds = new Set();
  // بيحاول يفتح الملف من الكاش، ولو مش موجود بيحاول يجيبه مباشرة من الـ
  // Worker. بيرجع true لو نجح، أو false لو محتاج المتصفح يرجع للطريقة
  // الاحتياطية (فتح صفحة Drive)
  async function resolveFileOpen(f){
    const contentUrl = getFileContentUrl(f.id);
    return (await tryOpenFromCache(contentUrl, f)) || (await tryOpenDirect(contentUrl, f));
  }

  // بيتسجل كل ما المستخدم يفتح ملف في "آخر الملفات" - وبيمسح أقدم ملف
  // (وأي نسخة محفوظة منه) لو العدد عدّى الحد الأقصى
  function recordFileOpen(f){
    let recent = loadJSON(RECENT_FILES_KEY, []).filter(x => x.id !== f.id);
    recent.unshift({ id: f.id, name: f.name, type: f.type });
    const trimmed = recent.slice(0, RECENT_FILES_MAX);
    const evicted = recent.slice(RECENT_FILES_MAX);
    saveJSON(RECENT_FILES_KEY, trimmed);
    evicted.forEach(ev => deleteCachedFile(ev.id));
  }
  function getRecentFiles(){ return loadJSON(RECENT_FILES_KEY, []); }
  function removeRecentFile(id){
    saveJSON(RECENT_FILES_KEY, getRecentFiles().filter(x => x.id !== id));
    deleteCachedFile(id);
    if(activeHomeTab === 'recent') renderRecentTab();
  }
  function clearRecentFiles(){
    getRecentFiles().forEach(f => deleteCachedFile(f.id));
    saveJSON(RECENT_FILES_KEY, []);
    if(activeHomeTab === 'recent') renderRecentTab();
  }

  function isFavorite(id){ return !!loadJSON(FAV_KEY, {})[id]; }
  function toggleFavorite(f){
    const favs = loadJSON(FAV_KEY, {});
    if(favs[f.id]) delete favs[f.id];
    else favs[f.id] = { id: f.id, name: f.name, type: f.type };
    saveJSON(FAV_KEY, favs);
  }
  function getFavoriteFiles(){ return Object.values(loadJSON(FAV_KEY, {})); }
  function clearFavorites(){
    saveJSON(FAV_KEY, {});
    if(activeHomeTab === 'favorites') renderFavoritesTab();
  }

  function renderRecentTab(){
    renderPlainList(getRecentFiles(), "🕘 You haven't opened any files yet", { onRemove: f => removeRecentFile(f.id), onClearAll: clearRecentFiles });
  }
  function renderFavoritesTab(){
    renderPlainList(getFavoriteFiles(), "⭐ No favorite files saved yet", { onClearAll: clearFavorites });
  }

  let activeHomeTab = null;
  function setActiveHomeTab(tab){
    activeHomeTab = tab;
    homeTabsEl.querySelectorAll('.home-tab[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  }
  homeTabsEl.querySelectorAll('.home-tab[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      if(activeHomeTab === tab){
        setActiveHomeTab(null);
        resultsEl.innerHTML = ""; loadMoreBtn.style.display = "none";
        setStatus("Type a file name or part of it first");
        return;
      }
      setActiveHomeTab(tab);
      currentFiles = []; renderedCount = 0;
      if(tab === 'recent') renderRecentTab();
      else renderFavoritesTab();
    });
  });

  // ===== الوضع الليلي =====
  function applyThemeButtonLabel(){
    const isDark = document.documentElement.classList.contains('dark');
    themeToggleBtn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  }
  applyThemeButtonLabel();
  themeToggleBtn.addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark');
    try{ localStorage.setItem('jigsearch_theme', isDark ? 'dark' : 'light'); }catch(e){ /* تجاهل */ }
    applyThemeButtonLabel();
  });

  let allFolderIds = null;   // كل الفولدرات (شامل الرئيسي) بعد الفهرسة
  let indexedFiles = null;   // كل ملفات الـ PDF (id + name) اللي اتفهرست جوه كل الفولدرات
  let allTopFolders = null;  // الفولدرات المباشرة جوه الروت بس (id + name) - المتاحة للفلترة
  let activeFolderFilter = null; // ID فولدر مباشر جوه الروت لو المستخدم فلتر النتايج بيه، أو null لكل الفولدرات
  let displayedCount = 0;
  let searchToken = 0; // بيتزود كل بحث جديد عشان نلغي نتيجة بحث قديم اتأخر

  function setLoading(isLoading){
    spinnerEl.classList.toggle('active', !!isLoading);
    searchBtn.disabled = !!isLoading;
  }

  function setStatus(text, isError){
    statusEl.textContent = text || "";
    statusEl.classList.toggle('status-error', !!isError);
  }

  // بيحوّل خطأ (فيه .category أو مش فيه) لرسالة عربي واضحة وموجّهة للمستخدم
  function friendlyErrorMessage(err){
    const category = err && err.category ? err.category : 'unknown';
    if(category === 'network'){
      return '❌ Internet connection problem. Make sure your device is connected and try again.';
    }
    if(category === 'permission'){
      return '❌ Permission problem: the app can\'t access the folder/files. Make sure the main folder on Google Drive is shared as "Anyone with the link – Viewer", and that the API Key is still enabled and correctly restricted to the Google Drive API and the site\'s domain.';
    }
    if(category === 'server'){
      return '❌ Google Drive servers are busy or having a temporary issue. Wait a minute and try refreshing again.';
    }
    return '❌ An unexpected error occurred: ' + (err && err.message ? err.message : 'Unknown') + '. Try again, and if it persists contact the app administrator.';
  }

  function checkSetup(){
    if(!PROXY_URL || PROXY_URL.includes("YOUR-SUBDOMAIN")){
      setupWarning.style.display = "block";
      setupWarning.innerHTML =
        "⚠️ You still need to set the Proxy Worker URL for search to work.<br>" +
        "Open the page file, find the <code>PROXY_URL</code> variable, and put the Worker URL in it after publishing it.<br>" +
        "Also make sure the folder is shared as \"Anyone with the link – Viewer\".";
      searchBtn.disabled = true;
      return false;
    }
    setupWarning.style.display = "none";
    return true;
  }

  function makeCategorizedError(message, category){
    const e = new Error(message);
    e.category = category; // 'network' | 'permission' | 'server' | 'unknown'
    return e;
  }

  // ===== حماية من استهلاك الـ quota بتاع Drive API =====
  // 1) rate limiter عام: بيضمن إن الطلبات متتبعتش كلها دفعة واحدة، حتى لو
  //    CRAWL_CONCURRENCY كبير - بيبقى فيه فاصل زمني أدنى بين بداية كل طلب.
  // 2) adaptive concurrency: لو بدأنا ناخد أخطاء 429/rate-limit كتير،
  //    بنقلل الـ concurrency تلقائيًا لحد ما الطلبات تستقر.
  const MIN_REQUEST_GAP_MS = 90; // أقصى حد تقريبي ~11 طلب/ثانية على مستوى التطبيق كله
  let requestChain = Promise.resolve();
  function throttledFetch(url){
    const run = requestChain.then(() => fetch(url));
    requestChain = requestChain.then(
      () => new Promise(r => setTimeout(r, MIN_REQUEST_GAP_MS)),
      () => new Promise(r => setTimeout(r, MIN_REQUEST_GAP_MS)) // ماتوقفش السلسلة حتى لو طلب فشل
    );
    return run;
  }

  let consecutiveRateErrors = 0;

  async function driveList(q, pageToken, retries){
    if(retries === undefined) retries = 3;
    const url = new URL(PROXY_URL);
    url.searchParams.set('q', q);
    if(pageToken) url.searchParams.set('pageToken', pageToken);
    let res, data;
    try{
      res = await throttledFetch(url.toString());
    }catch(networkErr){
      // فشل الـ fetch نفسه (مفيش نت، أو DNS، أو الموقع اتقفل فجأة)
      if(retries > 0){
        await new Promise(r => setTimeout(r, 800));
        return driveList(q, pageToken, retries - 1);
      }
      throw makeCategorizedError('Could not connect to the internet or to Google\'s servers.', 'network');
    }
    try{
      data = await res.json();
    }catch(parseErr){
      throw makeCategorizedError('Unexpected response from Google Drive servers.', 'server');
    }
    if(data.error){
      const status = res.status;
      const isRateLimit = status === 429 || status === 403;
      const retryableStatus = isRateLimit || status >= 500;
      if(isRateLimit){
        consecutiveRateErrors++;
        // لو بدأنا ناخد rate-limit متكرر، بنقلل سرعة الفهرسة تلقائيًا
        // (concurrency + الفاصل بين الطلبات) بدل ما نكمل نضرب في نفس السرعة
        if(consecutiveRateErrors % 3 === 0){
          CRAWL_CONCURRENCY = Math.max(2, Math.floor(CRAWL_CONCURRENCY * 0.6));
        }
      } else if(retryableStatus){
        // خطأ سيرفر مؤقت مش rate-limit، منعتبروش تراكمي زي 429
      } else {
        consecutiveRateErrors = 0;
      }
      if(retries > 0 && retryableStatus){
        const backoff = isRateLimit ? 1500 * (4 - retries) : 800;
        await new Promise(r => setTimeout(r, backoff));
        return driveList(q, pageToken, retries - 1);
      }
      let category = 'unknown';
      if(status === 401 || status === 403) category = 'permission';
      else if(status === 429 || status >= 500) category = 'server';
      else if(status === 404) category = 'permission'; // الفولدر مش موجود أو مش متاح
      throw makeCategorizedError(data.error.message || 'Unknown error from Google Drive', category);
    }
    consecutiveRateErrors = 0;
    return data;
  }

  const SUPPORTED_MIME_TYPES = {
    'application/pdf': 'pdf',
    // إكسل
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': 'excel', // .xlsx
    'application/vnd.ms-excel': 'excel', // .xls
    'application/vnd.google-apps.spreadsheet': 'gsheet', // شيت جوجل نيتيف (مش ملف حقيقي)
    // وورد
    'application/vnd.openxmlformats-officedocument.wordprocessingml.document': 'word', // .docx
    'application/msword': 'word', // .doc
    'application/vnd.google-apps.document': 'gdoc', // مستند جوجل نيتيف
    // بوربوينت
    'application/vnd.openxmlformats-officedocument.presentationml.presentation': 'ppt', // .pptx
    'application/vnd.ms-powerpoint': 'ppt', // .ppt
    'application/vnd.google-apps.presentation': 'gslides', // عرض جوجل نيتيف
    // صور
    'image/jpeg': 'image',
    'image/png': 'image',
    'image/gif': 'image',
    'image/webp': 'image',
    'image/bmp': 'image',
    'image/tiff': 'image',
    'image/heic': 'image'
  };
  // الأنواع اللي أولها g (gsheet/gdoc/gslides) دي ملفات جوجل نيتيف، مش ملف حقيقي
  // على القرص، فبتتفتح مباشرة في المتصفح بدل ما تتحمّل
  function isNativeGoogleType(type){ return type === 'gsheet' || type === 'gdoc' || type === 'gslides'; }

  let skippedFolderCount = 0;
  let skippedByCategory = { permission: 0, network: 0, server: 0, unknown: 0 };

  // بيجيب كل الأبناء (فولدرات + ملفات PDF/Excel) لفولدر واحد، مع دعم الصفحات.
  // النسخة دي "خام" وبترفع (throw) أي خطأ للي بيستدعيها بدل ما تبتلعه.
  async function fetchFolderChildrenRaw(folderId){
    const subfolders = [];
    const matches = [];
    let pageToken = null;
    let keepGoing = true;
    while(keepGoing){
      const q = `'${folderId}' in parents and trashed = false`;
      const data = await driveList(q, pageToken);
      (data.files || []).forEach(f => {
        if(f.mimeType === 'application/vnd.google-apps.folder'){
          subfolders.push({ id: f.id, name: f.name });
        } else if(SUPPORTED_MIME_TYPES[f.mimeType]){
          matches.push({ id: f.id, name: f.name, type: SUPPORTED_MIME_TYPES[f.mimeType] });
        }
      });
      pageToken = data.nextPageToken || null;
      keepGoing = !!pageToken;
    }
    return { subfolders, pdfs: matches };
  }

  // نسخة "آمنة" بتتخطى الفولدر ده وتكمل الباقي لو حصل خطأ (بتستخدم للفولدرات
  // الفرعية، عشان فولدر واحد ملوش صلاحية ميوقفش باقي الفهرسة)
  async function fetchFolderChildren(folderId){
    try{
      return await fetchFolderChildrenRaw(folderId);
    }catch(err){
      skippedFolderCount++;
      const cat = err && err.category ? err.category : 'unknown';
      skippedByCategory[cat] = (skippedByCategory[cat] || 0) + 1;
      return { subfolders: [], pdfs: [] };
    }
  }

  // بيشغّل fn على كل عناصر items بالتوازي بس بحد أقصى limit في نفس الوقت
  async function mapWithConcurrency(items, limit, fn){
    const results = new Array(items.length);
    let i = 0;
    async function worker(){
      while(i < items.length){
        const idx = i++;
        results[idx] = await fn(items[idx]);
      }
    }
    const workers = [];
    for(let k = 0; k < Math.min(limit, items.length); k++) workers.push(worker());
    await Promise.all(workers);
    return results;
  }

  const CRAWL_CONCURRENCY_DEFAULT = 8;
  let CRAWL_CONCURRENCY = CRAWL_CONCURRENCY_DEFAULT;

  // بيدور على كل الفولدرات الفرعية جوه فولدر معين (BFS)، وبيجمع أسماء
  // كل ملفات الـ PDF في نفس الوقت. كل فولدرات نفس المستوى بتتفهرس بالتوازي
  // (بحد أقصى CRAWL_CONCURRENCY في نفس الوقت) بدل واحد ورا التاني - بيقلل
  // وقت الفهرسة بشكل كبير من غير ما نضرب rate limit بتاع Drive API.
  // كل ملف بيتحط عليه "folder" = ID الفولدر المباشر جوه الروت اللي هو تابعله
  // (حتى لو الملف متداخل جوه فولدرات فرعية أعمق)، عشان فلترة النتائج بالفولدر.
  // ملفات الروت نفسه (مش جوه أي فولدر فرعي) بتاخد folder=null.
  async function crawlAllFoldersAndFiles(rootId, onProgress){
    // الفولدر الرئيسي بيتقرا من غير "ابتلاع" أي خطأ - لو فشل هنا فالمشكلة
    // عامة (نت/صلاحيات/سيرفر) مش مجرد فولدر فرعي، فلازم تبان بوضوح فوق
    const rootResult = await fetchFolderChildrenRaw(rootId);
    const topFolders = rootResult.subfolders.map(sf => ({ id: sf.id, name: sf.name }));
    const folderIds = [rootId, ...rootResult.subfolders.map(sf => sf.id)];
    const files = rootResult.pdfs.map(f => ({ ...f, folder: null }));
    let queue = rootResult.subfolders.map(sf => ({ id: sf.id, topFolderId: sf.id }));
    let level = 1;
    if(onProgress) onProgress(folderIds.length, files.length, level);
    while(queue.length){
      const nextQueue = [];
      const results = await mapWithConcurrency(queue, CRAWL_CONCURRENCY, item => fetchFolderChildren(item.id));
      results.forEach((res, idx) => {
        const topFolderId = queue[idx].topFolderId;
        res.subfolders.forEach(sf => {
          folderIds.push(sf.id);
          nextQueue.push({ id: sf.id, topFolderId });
        });
        res.pdfs.forEach(f => files.push({ ...f, folder: topFolderId }));
      });
      queue = nextQueue;
      level++;
      if(onProgress) onProgress(folderIds.length, files.length, level);
      if(level > 15) break; // حماية من حلقات لا نهائية
    }
    return { folderIds, files, topFolders };
  }

  // ===== تخزين الفهرس: IndexedDB (سعة أكبر وأثبت من localStorage)
  // مع fallback تلقائي لـ localStorage لو IndexedDB مش متاح =====
  const IDB_NAME = 'jigsearch_db';
  const IDB_STORE = 'kv';
  let idbPromise = null;

  function openIDB(){
    if(!('indexedDB' in window)) return Promise.resolve(null);
    if(idbPromise) return idbPromise;
    idbPromise = new Promise((resolve) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => {
        req.result.createObjectStore(IDB_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null); // نرجع null ونعمل fallback بدل ما نكسر التطبيق
    });
    return idbPromise;
  }

  async function idbGet(key){
    const db = await openIDB();
    if(!db) return undefined;
    return new Promise((resolve) => {
      try{
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(undefined);
      }catch(e){ resolve(undefined); }
    });
  }

  async function idbSet(key, value){
    const db = await openIDB();
    if(!db) return false;
    return new Promise((resolve) => {
      try{
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      }catch(e){ resolve(false); }
    });
  }

  async function loadCachedIndex(){
    try{
      let parsed = await idbGet(CACHE_KEY);
      if(!parsed){
        // fallback: كان متخزن قبل كده في localStorage (نسخة قديمة من التطبيق)
        const raw = localStorage.getItem(CACHE_KEY);
        parsed = raw ? JSON.parse(raw) : null;
      }
      if(!parsed) return null;
      if(parsed.rootId !== ROOT_FOLDER_ID) return null;
      if(!parsed.folderIds || !parsed.files) return null;
      // v8 adds background integrity checking so deleted/moved files cannot stay
      // visible indefinitely from an old local index.
      if(parsed.indexVersion && parsed.indexVersion < 8) return null;
      return parsed;
    }catch(e){ return null; }
  }

  async function saveCachedIndex(folderIds, files, topFolders){
    const payload = { rootId: ROOT_FOLDER_ID, ts: Date.now(), indexVersion: 8, folderIds, files, topFolders: topFolders || [] };
    const savedToIDB = await idbSet(CACHE_KEY, payload);
    if(!savedToIDB){
      // fallback لو IndexedDB فشل أو مش متاح
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify(payload)); }
      catch(e){ /* تجاهل لو التخزين ممتلئ */ }
    }
  }

  // بيرجع اسم الفولدر المباشر جوه الروت من ID بتاعه (للعرض في نافذة المعاينة)
  function folderNameById(id){
    if(!allTopFolders || !id) return null;
    const tf = allTopFolders.find(t => t.id === id);
    return tf ? tf.name : null;
  }

  // بيبني قايمة فلترة الفولدرات من الفولدرات المباشرة جوه الروت (REBUILD JIG SEARCH)
  function renderFolderFilterOptions(){
    if(!allTopFolders || !allTopFolders.length){ folderFilterWrap.style.display = 'none'; return; }
    folderFilterSelect.innerHTML = '';
    const allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = 'All';
    folderFilterSelect.appendChild(allOpt);
    allTopFolders.slice().sort((a, b) => {
      const aOther = a.name.trim().toUpperCase() === 'OTHERS';
      const bOther = b.name.trim().toUpperCase() === 'OTHERS';
      if(aOther && !bOther) return 1;
      if(bOther && !aOther) return -1;
      return a.name.localeCompare(b.name, 'ar');
    }).forEach(tf => {
      const opt = document.createElement('option');
      opt.value = tf.id;
      opt.textContent = tf.name;
      folderFilterSelect.appendChild(opt);
    });
    folderFilterSelect.value = activeFolderFilter || '';
    folderFilterWrap.style.display = 'flex';
  }
  folderFilterSelect.addEventListener('change', () => {
    activeFolderFilter = folderFilterSelect.value || null;
    setActiveHomeTab(null);
    if(qInput.value.trim()) runSearch();
  });

  // بيرجع true لو الفهرس جاهز في الميموري. الفهرسة بتتم تلقائيًا أول مرة
  // (لو مفيش فهرس محفوظ)، وبتتحدث تلقائيًا في الخلفية لو عدّى عليها أسبوع
  // من غير ما توقف البحث. زرار التحديث اليدوي لسه شغال في أي وقت.
  // background=true = تحديث تلقائي بالخلفية: من غير سبينر، ولو فشل بنسيب
  // الفهرس القديم شغال بدل ما نمسحه.
  // فحص سريع للفهرس المحفوظ: نقارن الملفات الموجودة فعليًا داخل كل فولدر
  // بالنسخة المحلية. ده يعالج الحذف والنقل خارج الفولدر، مش بس الملفات الجديدة/المعدلة.
  // الفحص يتم مرة واحدة في الجلسة وبشكل متوازي، ولو اكتشف اختلاف يعمل re-index تلقائيًا.
  let integrityCheckPromise = null;
  async function checkCachedIndexIntegrity(cached){
    if(!cached || !cached.folderIds || !cached.files) return false;
    if(integrityCheckPromise) return integrityCheckPromise;

    integrityCheckPromise = (async () => {
      try{
        const cachedById = new Map(cached.files.map(f => [f.id, f]));
        const liveIds = new Set();
        let mismatch = false;
        let i = 0;
        const folderIds = cached.folderIds.slice();
        const CONCURRENCY = 6;

        async function worker(){
          while(i < folderIds.length && !mismatch){
            const folderId = folderIds[i++];
            try{
              const live = await fetchFolderChildrenRaw(folderId);
              live.pdfs.forEach(f => liveIds.add(f.id));
              live.subfolders.forEach(sf => {
                if(!cached.folderIds.includes(sf.id)) mismatch = true;
              });
              // لو عدد/هوية الملفات اختلفت، نحتاج فهرسة جديدة.
              // نقارن IDs فقط لأن الاسم/النوع لا يهمان لاكتشاف الحذف أو النقل.
              for(const f of live.pdfs){
                if(!cachedById.has(f.id)) { mismatch = true; break; }
              }
              if(!mismatch){
                for(const f of cached.files){
                  if(f.folder === null && folderId !== ROOT_FOLDER_ID) continue;
                  if(cached.folderIds.includes(folderId) && !liveIds.has(f.id) && f.folder === folderId){
                    mismatch = true; break;
                  }
                }
              }
            }catch(e){
              // فشل فحص فولدر لا يعني أن الملف محذوف؛ نترك الفهرس كما هو.
            }
          }
        }

        const workers = [];
        for(let k=0;k<Math.min(CONCURRENCY, folderIds.length);k++) workers.push(worker());
        await Promise.all(workers);

        // فحص نهائي أدق: كل ملف في الكاش يجب أن يظهر في أحد مجلداته الحاليّة.
        if(!mismatch){
          const liveAll = new Set();
          let j = 0;
          async function collectWorker(){
            while(j < folderIds.length){
              const folderId = folderIds[j++];
              try{
                const live = await fetchFolderChildrenRaw(folderId);
                live.pdfs.forEach(f => liveAll.add(f.id));
              }catch(e){}
            }
          }
          const collectors = [];
          for(let k=0;k<Math.min(CONCURRENCY, folderIds.length);k++) collectors.push(collectWorker());
          await Promise.all(collectors);
          for(const f of cached.files){
            if(!liveAll.has(f.id)){ mismatch = true; break; }
          }
        }
        return mismatch;
      }finally{
        integrityCheckPromise = null;
      }
    })();
    return integrityCheckPromise;
  }

  async function ensureIndex(forceRefresh){
    if(allFolderIds && indexedFiles && !forceRefresh) return true;

    if(!forceRefresh){
      const cached = await loadCachedIndex();
      if(cached){
        allFolderIds = cached.folderIds;
        indexedFiles = cached.files;
        allTopFolders = cached.topFolders || [];
        renderFolderFilterOptions();
        const lastIndexDate = cached.ts ? new Date(cached.ts).toLocaleString('en-US', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Unknown';
        setStatus(`Last index update: ${lastIndexDate}.`);
        // Validate in the background. Search can use the cache immediately, while
        // deletions/moves/new files trigger an automatic refresh without a manual re-index.
        checkCachedIndexIntegrity(cached).then(changed => {
          if(changed && !isReindexing){
            newFilesBanner.textContent = '🔄 Index changed — updating automatically…';
            newFilesBanner.style.display = 'block';
            runManualReindex();
          }
        }).catch(() => {});
        return true;
      }
      // مفيش فهرس محفوظ - نعمل فهرسة تلقائية أول مرة من غير أي تدخل من المستخدم
    }

    setStatus("Automatically preparing the index of folders and files... (this happens once and is saved)");
    setLoading(true);
    skeletonLoader.style.display = 'flex';
    try{
      skippedFolderCount = 0;
      skippedByCategory = { permission: 0, network: 0, server: 0, unknown: 0 };
      consecutiveRateErrors = 0;
      CRAWL_CONCURRENCY = CRAWL_CONCURRENCY_DEFAULT;
      const result = await crawlAllFoldersAndFiles(ROOT_FOLDER_ID, (folderCount, fileCount, level) => {
        setStatus(`Indexing... ${folderCount} folders and ${fileCount} PDF/Office/image files so far (level ${level})`);
      });
      allFolderIds = result.folderIds;
      indexedFiles = result.files;
      allTopFolders = result.topFolders;
      renderFolderFilterOptions();
      await saveCachedIndex(allFolderIds, indexedFiles, allTopFolders);
      let note = '';
      if(skippedFolderCount){
        const parts = [];
        if(skippedByCategory.permission) parts.push(`${skippedByCategory.permission} due to permissions`);
        if(skippedByCategory.network) parts.push(`${skippedByCategory.network} due to network issues`);
        if(skippedByCategory.server) parts.push(`${skippedByCategory.server} due to temporary server issues`);
        if(skippedByCategory.unknown) parts.push(`${skippedByCategory.unknown} for an unknown reason`);
        note = ` (skipped ${skippedFolderCount} folders: ${parts.join(', ')})`;
      }
      setStatus(`Indexed ${allFolderIds.length} folders and ${indexedFiles.length} PDF/Office/image files${note}. Type your search term.`);
    }catch(err){
      setStatus(friendlyErrorMessage(err), true);
      allFolderIds = null;
      indexedFiles = null;
    }finally{
      setLoading(false);
      skeletonLoader.style.display = 'none';
    }
    return !!(allFolderIds && indexedFiles);
  }

  function fileIconLabel(f){
    if(f.type === 'excel' || f.type === 'gsheet') return 'XLS';
    if(f.type === 'word' || f.type === 'gdoc') return 'DOC';
    if(f.type === 'ppt' || f.type === 'gslides') return 'PPT';
    if(f.type === 'image') return 'IMG';
    return 'PDF';
  }
  // بيرجع SVG أيقونة ملف عامة (بتاخد لونها من CSS currentColor حسب النوع)
  const FILE_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">'
    + '<path d="M6 2.5h8l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V4A1.5 1.5 0 0 1 6.5 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>'
    + '<path d="M14 2.5V7a1 1 0 0 0 1 1h4.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>'
    + '<path d="M8.3 13h7.4M8.3 16.2h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'
    + '</svg>';
  function fileIconClass(f){
    if(f.type === 'excel' || f.type === 'gsheet') return 'xls';
    if(f.type === 'word' || f.type === 'gdoc') return 'doc';
    if(f.type === 'ppt' || f.type === 'gslides') return 'ppt';
    if(f.type === 'image') return 'img';
    return '';
  }
  // ===== أيقونات مخصصة لكل فولدر رئيسي - بتحل محل أيقونة نوع الملف لو الفولدر ليه أيقونة معرّفة =====
  const FOLDER_ICONS = {
    'tsk': 'icons/tsk.png',
    'probe location': 'icons/connectors.png',
    'dinefer': 'icons/dinefer.png',
    'divmac': 'icons/divmac.png',
    'others': 'icons/multimeter.png',
    'emdep': 'icons/emdep.png',
    'sde': 'icons/sde.png'
  };
  function folderIconUrl(f){
    const folderName = folderNameById(f.folder);
    if(!folderName) return null;
    return FOLDER_ICONS[folderName.trim().toLowerCase()] || null;
  }
  // بيرجع اسم كلاس اللون المناسب لأيقونة الملف: 'custom' لو الفولدر ليه أيقونة مخصصة، وإلا حسب نوع الملف
  function fileIconClassName(f){
    return folderIconUrl(f) ? 'custom' : fileIconClass(f);
  }
  // بيرجع HTML الأيقونة المناسبة للملف: أيقونة الفولدر المخصصة لو موجودة، وإلا أيقونة نوع الملف العامة
  function fileIconHtml(f){
    const url = folderIconUrl(f);
    if(url) return `<img src="${url}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
    return FILE_ICON_SVG;
  }
  function fileTypeLabel(f){
    if(f.type === 'gsheet') return 'Google Sheets';
    if(f.type === 'gdoc') return 'Google Docs';
    if(f.type === 'gslides') return 'Google Slides';
    if(f.type === 'excel') return 'Excel file';
    if(f.type === 'word') return 'Word file';
    if(f.type === 'ppt') return 'PowerPoint file';
    if(f.type === 'image') return 'Image';
    return 'PDF file';
  }
  // بيرجع روابط الملف الثلاثة: فتح (معاينة/تحرير)، تحميل، ومشاركة - حسب نوعه
  function getFileUrls(f){
    if(isNativeGoogleType(f.type)){
      const editBase = {
        gsheet: `https://docs.google.com/spreadsheets/d/${f.id}/edit`,
        gdoc: `https://docs.google.com/document/d/${f.id}/edit`,
        gslides: `https://docs.google.com/presentation/d/${f.id}/edit`
      }[f.type];
      const exportBase = {
        gsheet: `https://docs.google.com/spreadsheets/d/${f.id}/export?format=xlsx`,
        gdoc: `https://docs.google.com/document/d/${f.id}/export?format=docx`,
        gslides: `https://docs.google.com/presentation/d/${f.id}/export?format=pptx`
      }[f.type];
      return { view: editBase, download: exportBase, share: editBase };
    }
    if(f.type === 'image'){
      return {
        view: `https://drive.google.com/uc?export=view&id=${f.id}`,
        download: `https://drive.google.com/uc?export=download&id=${f.id}`,
        share: `https://drive.google.com/file/d/${f.id}/view`
      };
    }
    // PDF / Word / Excel / PowerPoint حقيقية - رابط "فتح" بيستخدم معاينة
    // جوجل درايف المدمجة بدل ما يحمّل الملف على طول
    return {
      view: `https://drive.google.com/file/d/${f.id}/view`,
      download: `https://drive.google.com/uc?export=download&id=${f.id}`,
      share: `https://drive.google.com/file/d/${f.id}/view`
    };
  }

  // ===== نافذة معاينة الملف: معلومات + أزرار فتح/تحميل/مشاركة =====
  function openPreviewModal(f){
    const urls = getFileUrls(f);

    previewIcon.innerHTML = fileIconHtml(f);

      previewOpenBtn.disabled = true;
      previewDownloadBtn.disabled = true;

      try{
        const opened = await resolveFileOpen(f);
        if(!opened) window.open(urls.download, '_blank', 'noopener');
      }finally{

        previewDownloadBtn.disabled = false;
        previewDownloadBtn.textContent = original;
      }

    };
    previewShareBtn.onclick = async () => {

      if(navigator.share){
        try{ await navigator.share({ title: f.name, url: urls.share }); }
        catch(e){ /* المستخدم لغى المشاركة أو حصل خطأ - نتجاهل */ }
        return;
      }
      try{
        await navigator.clipboard.writeText(urls.share);
        const original = previewShareBtn.textContent;
        previewShareBtn.textContent = '✅ Link copied';
        setTimeout(() => { previewShareBtn.textContent = original; }, 1800);
      }catch(e){

  function closePreviewModal(){ previewModalOverlay.style.display = 'none'; }
  previewModalClose.addEventListener('click', closePreviewModal);
  previewModalOverlay.addEventListener('click', (e) => { if(e.target === previewModalOverlay) closePreviewModal(); });

  // تطبيع عربي: توحيد الألف/التاء المربوطة/الياء وشيل التشكيل والتطويل
  function normalizeArabic(s){
    return s
      .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
      .replace(/[إأآا]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .replace(/[ؤئ]/g, 'ي');
  }

  // قاموس مرادفات لمصطلحات شائعة بين الإنجليزي والعربي (ممكن تتوسع بسهولة)
  const TERM_ALIASES = {
    connector: ['كونكتور', 'كونيكتور', 'كونكتورات', 'كونيكتورات'],
    cable: ['كابل', 'كابلات'],
    board: ['بورد', 'بوردات'],
    sensor: ['سنسور', 'سنسورات'],
    motor: ['موتور', 'موتورات'],
    screw: ['مسمار', 'براغي'],
    bracket: ['براكيت', 'براكيتات']
  };
  const REVERSE_ALIASES = {};
  Object.keys(TERM_ALIASES).forEach(key => {
    TERM_ALIASES[key].forEach(alt => { REVERSE_ALIASES[normalizeArabic(alt)] = key; });
  });

  // بيشيل جمع بسيط (إنجليزي s/es، عربي ات/ون/ين) عشان "connectors"="connector"
  function stripPlural(w){
    return /^[a-z]+$/.test(w) ? w.replace(/(es|s)$/, '') : w.replace(/(ات|ون|ين)$/, '');
  }

  // بيرجع كل الصيغ المكافئة لكلمة بحث واحدة (نفسها + مرادفاتها العربي/الإنجليزي)
  function expandWordForms(word){
    const forms = new Set();
    const lower = word.toLowerCase();
    forms.add(lower);
    const normalized = normalizeArabic(lower);
    forms.add(normalized);
    const stemmed = stripPlural(normalized);
    forms.add(stemmed);
    if(TERM_ALIASES[stemmed]) TERM_ALIASES[stemmed].forEach(a => forms.add(normalizeArabic(a)));
    if(REVERSE_ALIASES[stemmed]) forms.add(REVERSE_ALIASES[stemmed]);
    return Array.from(forms).filter(Boolean);
  }

  // بيقسّم كلمة البحث لكذا كلمة (على المسافات)، وكل كلمة بترجع كل صيغها المكافئة
  function splitSearchWords(term){
    return term.split(/\s+/).filter(Boolean).map(expandWordForms);
  }

  // مطابقة substring حقيقية على كل الصيغ المكافئة للكلمة (نفسها + مرادفاتها
  // عربي/إنجليزي)، بتغطي أرقام الطلبات وأغلب الحالات من غير بحث ضبابي
  function matchesAllWords(fileName, wordFormsList){
    const nameLower = fileName.toLowerCase();
    const nameNorm = normalizeArabic(nameLower);
    return wordFormsList.every(forms => forms.some(f => nameLower.includes(f) || nameNorm.includes(f)));
  }

  // بيقسّم اسم الملف لكلمات/رموز منفصلة (على أي فاصل زي _ - مسافة نقطة)
  function tokenize(fileName){
    return normalizeArabic(fileName.toLowerCase()).split(/[^a-z0-9\u0600-\u06ff]+/i).filter(Boolean);
  }
  // بيتحقق إن نص البحث (أو كل كلمة فيه) اتطابق مع "كلمة منفصلة" كاملة في
  // اسم الملف (مش مجرد جزء من كلمة أطول، زي 02P15GD3L)
  function matchesAsSeparateWords(fileName, wordFormsList){
    const tokens = tokenize(fileName);
    return wordFormsList.every(forms => forms.some(f => tokens.includes(f)));
  }
  // بيدي درجة أولوية ثانوية (تُستخدم بعد ترتيب الكلمات المنفصلة) حسب قرب
  // اسم الملف من نص البحث ككل: تطابق كامل، بداية الاسم، احتواء العبارة
  function relevanceScore(fileName, termNorm){
    const nameNorm = normalizeArabic(fileName.toLowerCase());
    if(!termNorm) return 3;
    if(nameNorm === termNorm) return 0;
    if(nameNorm.startsWith(termNorm)) return 1;
    if(nameNorm.includes(termNorm)) return 2;
    return 3;
  }
  // الترتيب المطلوب: النتايج اللي اتطابقت بكلمة منفصلة كاملة (زي 02P15GD3)
  // تيجي الأول، وبعدها الباقي (تطابق جزئي جوه كلمة أطول زي 02P15GD3L) مرتب
  // حسب الأقرب (تطابق كامل > بداية الاسم > احتواء > الأقرب في الطول)
  function sortByRelevance(files, term, wordFormsList){
    const termNorm = normalizeArabic(term.toLowerCase().trim());
    return files.slice().sort((a, b) => {
      const wa = matchesAsSeparateWords(a.name, wordFormsList) ? 0 : 1;
      const wb = matchesAsSeparateWords(b.name, wordFormsList) ? 0 : 1;
      if(wa !== wb) return wa - wb;
      const sa = relevanceScore(a.name, termNorm);
      const sb = relevanceScore(b.name, termNorm);
      if(sa !== sb) return sa - sb;
      const diffA = Math.abs(a.name.length - termNorm.length);
      const diffB = Math.abs(b.name.length - termNorm.length);
      if(diffA !== diffB) return diffA - diffB;
      return a.name.localeCompare(b.name, 'ar');
    });
  }

  let currentFiles = [];
  let renderedCount = 0;
  let lastSearchWordForms = null; // بيتحط بس وقت البحث الفعلي، عشان تمييز الكلمة في النتايج

  // بيرجع محتوى <div class="file-name"> كنص عادي أو بتمييز الكلمات المتطابقة
  // (لو فيه بحث نشط)، من غير innerHTML عشان اسم الملف يفضل آمن من XSS
  function buildHighlightedName(name, wordFormsList){
    const redRanges = [];
    const psRegex = /(PS1_|PS2_|PS3_|PS7_)([^.]*?)(?=\.pdf$)/ig;
    let m;
    while((m = psRegex.exec(name)) !== null){
      redRanges.push([m.index, m.index + m[0].length]);
    }
    const ranges = [];
    if(wordFormsList && wordFormsList.length){
      const nameLower = name.toLowerCase();
      wordFormsList.forEach(forms => forms.forEach(f => {
        if(!f) return;
        let idx = 0;
        while(true){
          const pos = nameLower.indexOf(f, idx);
          if(pos === -1) break;
          ranges.push([pos, pos + f.length]);
          idx = pos + f.length;
        }
      }));
    }
    ranges.push(...redRanges);
    if(!ranges.length) return document.createTextNode(name);
    ranges.sort((a,b)=>a[0]-b[0] || a[1]-b[1]);
    const merged=[];
    ranges.forEach(r=>{
      const last=merged[merged.length-1];
      if(last && r[0] <= last[1]) last[1]=Math.max(last[1],r[1]);
      else merged.push(r.slice());
    });
    const frag=document.createDocumentFragment(); let cursor=0;
    merged.forEach(([start,end])=>{
      if(start>cursor) frag.appendChild(document.createTextNode(name.slice(cursor,start)));
      const mark=document.createElement('mark');
      const isRed=redRanges.some(r=>r[0]<=start && r[1]>=end);
      mark.className=isRed ? 'ps-highlight' : 'search-highlight';
      mark.textContent=name.slice(start,end); frag.appendChild(mark); cursor=end;
    });
    if(cursor<name.length) frag.appendChild(document.createTextNode(name.slice(cursor)));
    return frag;
  }

  function showResultsPage(files, append){
    if(!append){
      resultsEl.innerHTML = "";
      displayedCount = 0;
      currentFiles = files;
      renderedCount = 0;
    }
    const nextBatch = currentFiles.slice(renderedCount, renderedCount + PAGE_SIZE);
    renderFiles(nextBatch);
    renderedCount += nextBatch.length;

    const remaining = currentFiles.length - renderedCount;
    if(remaining > 0){
      loadMoreBtn.style.display = "block";
      loadMoreBtn.textContent = `Load More (${remaining} left)`;
    } else {
      loadMoreBtn.style.display = "none";
    }
  }

  function buildResultItem(f, opts){
    opts = opts || {};
    const a = document.createElement('a');
    a.className = 'result-item';
    // بدل ما نحمّل الملف مباشرة، بنفتح نافذة معاينة فيها معلومات الملف
    // وخيارات (فتح / تحميل / مشاركة). الـ href هنا لسه بيتحط كـ fallback
    // (مثلاً لو المستخدم عمل right-click "فتح في تاب جديدة")
    a.href = getFileUrls(f).view;
    a.addEventListener('click', async (e) => {
      e.preventDefault();
      if(openingFileIds.has(f.id)) return; // منع الفتح المزدوج لو دوس مرتين بسرعة
      openingFileIds.add(f.id);
      a.classList.add('is-opening');
      // بنحاول نفتح الملف مباشرة (من غير الدخول على صفحة Google Drive) عن
      // طريق الـ Worker - ولو فشل لأي سبب، نرجع للطريقة الاحتياطية القديمة
      const urls = getFileUrls(f);
      recordFileOpen(f);
      try{
        const opened = await resolveFileOpen(f);
        if(!opened){
          if(f.type === 'pdf'){
            window.open(urls.view, '_blank', 'noopener');
          } else {
            window.open(urls.download, '_blank', 'noopener');
          }
        }
      }finally{
        openingFileIds.delete(f.id);
        a.classList.remove('is-opening');
      }
    });

    // بنبني العناصر بـ createElement/textContent مش innerHTML، عشان لو اسم
    // ملف فيه HTML/سكريبت متخزّن في Drive منفّذوش جوه الصفحة (XSS)
    const iconDiv = document.createElement('div');
    iconDiv.className = 'file-icon' + (fileIconClassName(f) ? ' ' + fileIconClassName(f) : '');
    iconDiv.innerHTML = fileIconHtml(f);

    const nameDiv = document.createElement('div');
    nameDiv.className = 'file-name';
    nameDiv.appendChild(buildHighlightedName(f.name, opts.highlightForms));

    const starBtn = document.createElement('button');
    starBtn.type = 'button';
    starBtn.className = 'star-btn' + (isFavorite(f.id) ? ' active' : '');
    starBtn.textContent = isFavorite(f.id) ? '⭐' : '☆';
    starBtn.setAttribute('aria-label', 'Save to favorites');
    starBtn.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      toggleFavorite(f);
      const fav = isFavorite(f.id);
      starBtn.classList.toggle('active', fav);
      starBtn.textContent = fav ? '⭐' : '☆';
      if(activeHomeTab === 'favorites') renderFavoritesTab();
    });

    a.appendChild(iconDiv);
    a.appendChild(nameDiv);
    a.appendChild(starBtn);
    if(opts.onRemove){
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'star-btn remove-btn';
      removeBtn.textContent = '🗑';
      removeBtn.setAttribute('aria-label', 'Remove from this list');
      removeBtn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        opts.onRemove(f);
      });
      a.appendChild(removeBtn);
    }
    return a;
  }

  // بيعرض قايمة بسيطة (آخر الملفات / الأكثر استخدامًا / المفضلة) من غير ترقيم صفحات
  // opts.onRemove(f) لحذف عنصر واحد، opts.onClearAll() لمسح القايمة كلها
  function renderPlainList(files, emptyMessage, opts){
    opts = opts || {};
    resultsEl.innerHTML = "";
    loadMoreBtn.style.display = "none";
    if(!files.length){ setStatus(emptyMessage); return; }
    if(opts.onClearAll){
      const clearWrap = document.createElement('div');
      clearWrap.className = 'list-clear-all-wrap';
      const clearBtn = document.createElement('button');
      clearBtn.type = 'button';
      clearBtn.className = 'recent-clear-all';
      clearBtn.textContent = '🗑 Clear this list';
      clearBtn.addEventListener('click', opts.onClearAll);
      clearWrap.appendChild(clearBtn);
      resultsEl.appendChild(clearWrap);
    }
    const frag = document.createDocumentFragment();
    files.forEach(f => frag.appendChild(buildResultItem(f, { onRemove: opts.onRemove })));
    resultsEl.appendChild(frag);
    setStatus("");
  }

  function renderFiles(files){
    const frag = document.createDocumentFragment();
    files.forEach(f => {
      frag.appendChild(buildResultItem(f, { highlightForms: lastSearchWordForms }));
      displayedCount++;
    });
    resultsEl.appendChild(frag);
  }

  // ===== آخر 5 عمليات بحث (recent searches) - متخزنة محليًا في المتصفح =====
  const RECENT_SEARCH_KEY = 'jigsearch_recent_searches_v1';
  const RECENT_SEARCH_MAX = 3;

  function loadRecentSearches(){
    try{
      const raw = localStorage.getItem(RECENT_SEARCH_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }

  function saveRecentSearch(term){
    const clean = term.trim();
    if(!clean) return;
    let list = loadRecentSearches().filter(t => t.toLowerCase() !== clean.toLowerCase());
    list.unshift(clean);
    list = list.slice(0, RECENT_SEARCH_MAX);
    try{ localStorage.setItem(RECENT_SEARCH_KEY, JSON.stringify(list)); }catch(e){ /* تجاهل لو التخزين ممتلئ */ }
    renderRecentSearches();
  }

  function renderRecentSearches(){
    const list = loadRecentSearches();
    recentSearchesEl.innerHTML = '';
    if(!list.length){
      recentSearchesEl.style.display = 'none';
      return;
    }
    const label = document.createElement('span');
    label.className = 'recent-searches-label';
    label.textContent = 'Recent searches:';
    recentSearchesEl.appendChild(label);
    list.forEach(term => {
      const wrap = document.createElement('span');
      wrap.className = 'recent-chip-wrap';
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'recent-chip';
      chip.textContent = term;
      chip.addEventListener('click', () => {
        qInput.value = term;
        qClear.style.display = 'flex';
        runSearch();
      });
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'recent-chip-remove';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', 'Remove this search');
      removeBtn.addEventListener('click', (e) => { e.stopPropagation(); removeRecentSearch(term); });
      wrap.appendChild(chip);
      wrap.appendChild(removeBtn);
      recentSearchesEl.appendChild(wrap);
    });
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'recent-clear-all';
    clearBtn.textContent = 'Clear all';
    clearBtn.addEventListener('click', clearRecentSearches);
    recentSearchesEl.appendChild(clearBtn);
    recentSearchesEl.style.display = 'flex';
  }

  function removeRecentSearch(term){
    const list = loadRecentSearches().filter(t => t.toLowerCase() !== term.toLowerCase());
    try{ localStorage.setItem(RECENT_SEARCH_KEY, JSON.stringify(list)); }catch(e){ /* تجاهل */ }
    renderRecentSearches();
  }

  function clearRecentSearches(){
    try{ localStorage.removeItem(RECENT_SEARCH_KEY); }catch(e){ /* تجاهل */ }
    renderRecentSearches();
  }

  let suggestionIndex = [];
  let activeSuggestionIndex = -1;
  let suggestionTimer = null;

  function hideSearchSuggestions(){
    searchSuggestions.style.display = 'none';
    searchSuggestions.innerHTML = '';
    activeSuggestionIndex = -1;
  }

  function buildSuggestionIndex(){
    if(!indexedFiles) return;
    suggestionIndex = Array.from(new Set(indexedFiles.map(f => f.name).filter(Boolean)));
  }

  function renderSearchSuggestions(term){
    const clean = term.trim().toLowerCase();
    if(!clean || !suggestionIndex.length){ hideSearchSuggestions(); return; }
    const words = clean.split(/\s+/).filter(Boolean);
    const matches = suggestionIndex
      .filter(name => {
        const n = name.toLowerCase();
        return words.every(w => n.includes(w));
      })
      .sort((a,b) => {
        const al = a.toLowerCase(), bl = b.toLowerCase();
        const ap = al.startsWith(clean) ? 0 : 1;
        const bp = bl.startsWith(clean) ? 0 : 1;
        return ap - bp || a.length - b.length || a.localeCompare(b);
      })
      .slice(0, 7);

    searchSuggestions.innerHTML = '';
    if(!matches.length){ hideSearchSuggestions(); return; }
    matches.forEach((name, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'search-suggestion';
      btn.textContent = name;
      btn.addEventListener('mousedown', e => e.preventDefault());
      btn.addEventListener('click', () => {
        qInput.value = name;
        qClear.style.display = 'flex';
        hideSearchSuggestions();
        runSearch();
      });
      searchSuggestions.appendChild(btn);
    });
    searchSuggestions.style.display = 'block';
  }

  async function updateSearchSuggestions(){
    const term = qInput.value.trim();
    if(!term){ hideSearchSuggestions(); return; }
    try{
      const ready = await ensureIndex(false);
      if(ready){
        buildSuggestionIndex();
        renderSearchSuggestions(term);
      }
    }catch(e){ hideSearchSuggestions(); }
  }

  // البحث بيتم بالكامل محليًا على الفهرس المخزن (allFolderIds + indexedFiles)
  // من غير أي طلبات جديدة لـ Google Drive - أسرع بكتير ومش بيستهلك quota الـ API
  async function getCachedPdfText(fileId){
    try{
      const value = await idbGet(PDF_TEXT_CACHE_PREFIX + fileId);
      if(typeof value === 'string') return value;
    }catch(e){}
    return null;
  }

  async function setCachedPdfText(fileId, text){
    try{ await idbSet(PDF_TEXT_CACHE_PREFIX + fileId, text.slice(0, PDF_TEXT_MAX_CHARS)); }catch(e){}
  }

  async function extractPdfText(file){
    const cached = await getCachedPdfText(file.id);
    if(cached !== null) return cached;
    if(!configurePdfJs()) throw new Error('PDF search library is not ready');

    const res = await fetch(getFileContentUrl(file.id));
    if(!res.ok) throw new Error('Could not download PDF');
    const data = new Uint8Array(await res.arrayBuffer());
    const pdf = await window.pdfjsLib.getDocument({data}).promise;
    let text = '';
    for(let pageNo=1; pageNo<=pdf.numPages; pageNo++){
      const page = await pdf.getPage(pageNo);
      const content = await page.getTextContent();
      text += content.items.map(item => item.str || '').join(' ') + '\n';
      if(text.length >= PDF_TEXT_MAX_CHARS) break;
    }
    text = text.slice(0, PDF_TEXT_MAX_CHARS);
    await setCachedPdfText(file.id, text);
    return text;
  }

  async function runPdfContentSearch(term, words, token){
    const candidates = indexedFiles.filter(f =>
      f.type === 'pdf' && (activeFolderFilter === null || f.folder === activeFolderFilter)
    );
    if(!candidates.length){
      showResultsPage([], false);
      setStatus('🔍 No PDF files available');
      return;
    }

    setLoading(true);
    skeletonLoader.style.display = 'flex';
    resultsEl.innerHTML = '';
    loadMoreBtn.style.display = 'none';

    const normalizedTerm = normalizeArabic(term).toLowerCase();
    const matches = [];
    let next = 0;
    const CONCURRENCY = 3;

    async function worker(){
      while(next < candidates.length){
        const idx = next++;
        const file = candidates[idx];
        if(token !== searchToken) return;
        try{
          const text = await extractPdfText(file);
          const normalized = normalizeArabic(text).toLowerCase();
          const ok = words.every(w => {
            const nw = normalizeArabic(w).toLowerCase();
            return normalized.includes(nw);
          });
          if(ok) matches.push(file);
          setStatus(`Searching PDF content… ${Math.min(idx + 1, candidates.length)}/${candidates.length}<span class="pdf-search-progress"></span>`);
        }catch(e){
          // تجاهل ملف PDF واحد لو محتواه غير قابل للاستخراج.
        }
      }
    }

    try{
      const workers = [];
      for(let k=0;k<Math.min(CONCURRENCY,candidates.length);k++) workers.push(worker());
      await Promise.all(workers);
      if(token !== searchToken) return;
      const sorted = sortByRelevance(matches, term, words);
      showResultsPage(sorted, false);
      setStatus(sorted.length ? `Found ${sorted.length} PDFs containing "${term}"` : `🔍 No PDF contains "${term}"`);
      saveRecentSearch(term);
    }finally{
      setLoading(false);
      skeletonLoader.style.display = 'none';
    }
  }

  async function runSearch(){
    const term = qInput.value.trim();
    setActiveHomeTab(null);

    if(!term){
      setStatus("Type a file name or part of it first");
      resultsEl.innerHTML = "";
      currentFiles = [];
      renderedCount = 0;
      lastSearchWordForms = null;
      loadMoreBtn.style.display = "none";
      return;
    }
    if(!checkSetup()) return;

    const myToken = ++searchToken; // عشان لو المستخدم كتب أسرع من رد الفهرسة، نتجاهل النتيجة القديمة

    const ready = await ensureIndex(false);
    if(!ready) return;
    if(myToken !== searchToken) return; // بحث أحدث بدأ فعلاً

    const words = splitSearchWords(term);
    lastSearchWordForms = words;
    const nameMatched = indexedFiles.filter(f =>
      matchesAllWords(f.name, words) && (activeFolderFilter === null || f.folder === activeFolderFilter)
    );

    if(searchInsidePdf.checked){
      hideSearchSuggestions();
      await runPdfContentSearch(term, words, myToken);
      return;
    }

    const sortedMatched = sortByRelevance(nameMatched, term, words);
    showResultsPage(sortedMatched, false);
    setStatus(nameMatched.length ? `Found ${nameMatched.length} results` : "🔍 No matching results");
    saveRecentSearch(term);
  }

  // ===== قايمة "بحث متقدم" المنسدلة =====
  function openAdvancedMenu(){ advancedSearchMenu.style.display = 'block'; }
  function closeAdvancedMenu(){ advancedSearchMenu.style.display = 'none'; }
