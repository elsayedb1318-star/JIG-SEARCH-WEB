<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIG SEARCH</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a56db">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --blue:#1a56db;
    --blue-dark:#1442a8;
    --bg:#eef1f6;
    --card:#ffffff;
    --border:#d9dee6;
    --text:#1f2430;
    --muted:#6b7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .header{
    width:100%;
    background:var(--card);
    padding:36px 20px 28px;
    box-shadow:0 2px 10px rgba(20,30,60,.06);
    border-bottom-left-radius:28px;
    border-bottom-right-radius:28px;
  }
  .title{
    text-align:center;
    font-size:32px;
    font-weight:800;
    letter-spacing:1px;
    color:var(--blue);
    margin:0 0 24px;
    font-family:Tahoma, Arial, sans-serif;
  }
  .search-box{
    max-width:520px;
    margin:0 auto;
  }
  input#q{
    width:100%;
    padding:16px 18px;
    font-size:16px;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    background:#fff;
    text-align:right;
  }
  input#q:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(26,86,219,.15);
  }
  button#searchBtn{
    width:100%;
    margin-top:14px;
    padding:16px;
    font-size:18px;
    font-weight:600;
    color:#fff;
    background:var(--blue);
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:background .15s ease;
  }
  button#searchBtn:hover{ background:var(--blue-dark); }
  button#searchBtn:disabled{ background:#9db4e8; cursor:default; }
  .powered{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-top:16px;
  }
  .refresh-index-btn{
    display:block;
    margin:14px auto 0;
    padding:8px 18px;
    background:#fff;
    border:1px solid var(--border);
    color:var(--blue);
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
  }
  .refresh-index-btn:hover{ border-color:var(--blue); }
  .refresh-index-btn:disabled{ opacity:.6; cursor:default; }
  .content{
    width:100%;
    max-width:640px;
    padding:22px 16px 60px;
  }
  .status{
    text-align:center;
    color:var(--muted);
    margin-top:24px;
    font-size:15px;
  }
  .results{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:8px;
  }
  .result-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    text-decoration:none;
    color:var(--text);
  }
  .result-item:hover{ border-color:var(--blue); }
  .file-icon{
    flex:0 0 auto;
    width:36px;height:36px;
    border-radius:8px;
    background:#fde8e8;
    color:#c0392b;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
  }
  .file-name{
    flex:1;
    font-size:15px;
    word-break:break-word;
    text-align:right;
  }
  .load-more{
    display:block;
    margin:16px auto 0;
    padding:10px 22px;
    background:#fff;
    border:1px solid var(--blue);
    color:var(--blue);
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
  }
  .setup-warning{
    max-width:640px;
    margin:18px auto 0;
    background:#fff7e6;
    border:1px solid #ffd591;
    color:#8a5b00;
    border-radius:10px;
    padding:14px 16px;
    font-size:13.5px;
    line-height:1.7;
    text-align:right;
  }
  .setup-warning code{
    background:#fff1d1;
    padding:1px 5px;
    border-radius:4px;
    direction:ltr;
    unicode-bidi:embed;
  }
  .status{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .spinner{
    display:none;
    width:18px;
    height:18px;
    border:3px solid #c9d4e8;
    border-top-color:var(--blue);
    border-radius:50%;
    animation:spin .7s linear infinite;
    flex:0 0 auto;
  }
  .spinner.active{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .cache-note{
    text-align:center;
    color:#9aa3b2;
    font-size:12.5px;
    margin-top:-4px;
    margin-bottom:8px;
  }
</style>
</head>
<body>

  <div class="header">
    <h1 class="title">JIG SEARCH</h1>
    <div class="search-box">
      <input type="text" id="q" placeholder="connector or order number" />
      <button id="searchBtn">بحث</button>
    </div>
    <div class="powered">Powered by Elsayed adel</div>
    <button id="refreshIndexBtn" class="refresh-index-btn">🔄 تحديث الفهرس</button>
  </div>

  <div class="content">
    <div id="setupWarning" class="setup-warning" style="display:none;"></div>
    <div id="status" class="status">
      <span id="spinner" class="spinner"></span>
      <span id="statusText"></span>
    </div>
    <div id="cacheNote" class="cache-note" style="display:none;"></div>
    <div id="results" class="results"></div>
    <button id="loadMoreBtn" class="load-more" style="display:none;">تحميل المزيد</button>
  </div>

<script>
  // =========================================================
  // إعدادات لازم تتظبط قبل ما الصفحة تشتغل:
  // =========================================================
  const API_KEY = "AIzaSyC7F7fO9WYl7Qzt0Zl45Mk04XlZuoOJ4uo"; // <-- حط الـ API Key هنا
  const ROOT_FOLDER_ID = "1m0jhTeU8PtiaFu9G_mzH_NxLD-IayaR-"; // ID الفولدر الرئيسي
  const PAGE_SIZE = 30;
  const FOLDER_CHUNK_SIZE = 20; // عدد الفولدرات في كل استعلام بحث واحد
  const CACHE_KEY = 'jigsearch_folder_index_v2';
  // ملحوظة: مفيش وقت انتهاء صلاحية للفهرس دلوقتي.
  // الفهرسة بتتم مرة واحدة وتتحدث بس لما تدوس زرار "تحديث الفهرس" يدويًا.
  // =========================================================

  const qInput = document.getElementById('q');
  const searchBtn = document.getElementById('searchBtn');
  const statusEl = document.getElementById('statusText');
  const spinnerEl = document.getElementById('spinner');
  const cacheNoteEl = document.getElementById('cacheNote');
  const resultsEl = document.getElementById('results');
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const setupWarning = document.getElementById('setupWarning');
  const refreshIndexBtn = document.getElementById('refreshIndexBtn');

  let allFolderIds = null;      // كل الفولدرات (شامل الرئيسي) بعد الفهرسة
  let currentQuery = "";
  let pendingChunks = [];       // الشنكات اللي لسه محتاجين نبحث فيها للصفحة الحالية
  let chunkPageTokens = {};     // nextPageToken لكل شنك لو فيه صفحات زيادة
  let displayedCount = 0;

  const RESULTS_CACHE_KEY = 'jigsearch_results_cache_v1';
  const RESULTS_CACHE_MAX = 15;   // أقصى عدد كلمات بحث نحتفظ بنتايجها
  const DEBOUNCE_MS = 550;
  let debounceTimer = null;
  let searchToken = 0; // بيتزود كل بحث جديد عشان نلغي نتايج بحث قديم اتأخر

  function setLoading(isLoading){
    spinnerEl.classList.toggle('active', !!isLoading);
    searchBtn.disabled = !!isLoading;
  }

  function setStatus(text){
    statusEl.textContent = text || "";
  }

  function checkSetup(){
    if(!API_KEY || API_KEY === "YOUR_GOOGLE_API_KEY_HERE"){
      setupWarning.style.display = "block";
      setupWarning.innerHTML =
        "⚠️ لسه محتاج تحط الـ Google API Key عشان البحث يشتغل.<br>" +
        "افتح ملف الصفحة، دوّر على المتغيّر <code>API_KEY</code>، وحطّ فيه الكود من Google Cloud Console.<br>" +
        "وتأكد إن الفولدر معمول له مشاركة \"Anyone with the link – Viewer\".";
      searchBtn.disabled = true;
      return false;
    }
    setupWarning.style.display = "none";
    return true;
  }

  function escapeForDriveQuery(str){
    return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  async function driveList(q, pageToken){
    const url = new URL('https://www.googleapis.com/drive/v3/files');
    url.searchParams.set('q', q);
    url.searchParams.set('fields', 'nextPageToken, files(id, name, webViewLink, mimeType)');
    url.searchParams.set('pageSize', '1000');
    url.searchParams.set('key', API_KEY);
    url.searchParams.set('supportsAllDrives', 'true');
    url.searchParams.set('includeItemsFromAllDrives', 'true');
    if(pageToken) url.searchParams.set('pageToken', pageToken);
    const res = await fetch(url.toString());
    const data = await res.json();
    if(data.error) throw new Error(data.error.message || 'خطأ غير معروف من Google Drive');
    return data;
  }

  let skippedFolderCount = 0;

  // بيدور على كل الفولدرات الفرعية جوه فولدر معين، من كل المستويات (BFS)
  // لو فولدر معين مش عنده صلاحية وصول، بيتخطاه ويكمل الباقي بدل ما يوقف
  async function crawlAllFolders(rootId, onProgress){
    const all = [rootId];
    let queue = [rootId];
    let level = 0;
    while(queue.length){
      const nextQueue = [];
      for(const folderId of queue){
        let pageToken = null;
        let keepGoing = true;
        while(keepGoing){
          try{
            const q = `'${folderId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
            const data = await driveList(q, pageToken);
            (data.files || []).forEach(f => { all.push(f.id); nextQueue.push(f.id); });
            pageToken = data.nextPageToken || null;
            keepGoing = !!pageToken;
          }catch(err){
            // فولدر مش متاح الوصول له (صلاحيات، أو Shortcut معطوب) - نتخطاه ونكمل
            skippedFolderCount++;
            keepGoing = false;
          }
        }
      }
      queue = nextQueue;
      level++;
      if(onProgress) onProgress(all.length, level);
      if(level > 15) break; // حماية من حلقات لا نهائية
    }
    return all;
  }

  function loadCachedIndex(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(parsed.rootId !== ROOT_FOLDER_ID) return null;
      return parsed.folderIds;
    }catch(e){ return null; }
  }

  function saveCachedIndex(folderIds){
    try{
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        rootId: ROOT_FOLDER_ID, ts: Date.now(), folderIds
      }));
    }catch(e){ /* تجاهل لو التخزين ممتلئ */ }
  }

  async function ensureIndex(forceRefresh){
    if(allFolderIds && !forceRefresh) return allFolderIds;

    if(!forceRefresh){
      const cached = loadCachedIndex();
      if(cached && cached.length){
        allFolderIds = cached;
        setStatus(`(من الفهرس المخزن) تم العثور على ${allFolderIds.length} فولدر. اكتب كلمة البحث.`);
        return allFolderIds;
      }
    }

    setStatus("بيتم تجهيز فهرس الفولدرات لأول مرة... (هيتم مرة واحدة بس ويتخزن)");
    setLoading(true);
    try{
      skippedFolderCount = 0;
      allFolderIds = await crawlAllFolders(ROOT_FOLDER_ID, (count, level) => {
        setStatus(`بيتم فهرسة الفولدرات... تم إيجاد ${count} فولدر (مستوى ${level})`);
      });
      saveCachedIndex(allFolderIds);
      setStatus(`تم فهرسة ${allFolderIds.length} فولدر${skippedFolderCount ? ` (اتخطى ${skippedFolderCount} فولدر ملوش صلاحية وصول)` : ''}. اكتب كلمة البحث.`);
    }catch(err){
      setStatus("حصل خطأ أثناء الفهرسة: " + err.message);
      allFolderIds = null;
    }finally{
      setLoading(false);
    }
    return allFolderIds;
  }

  function chunkArray(arr, size){
    const out = [];
    for(let i=0; i<arr.length; i+=size) out.push(arr.slice(i, i+size));
    return out;
  }

  // ===== Cache لنتايج آخر عمليات البحث (localStorage) =====
  function loadResultsCache(){
    try{
      const raw = localStorage.getItem(RESULTS_CACHE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }

  function saveResultToCache(term, files){
    try{
      const cache = loadResultsCache();
      cache[term] = { files, ts: Date.now() };
      // نحافظ على أحدث RESULTS_CACHE_MAX عنصر بس
      const keys = Object.keys(cache).sort((a,b) => cache[b].ts - cache[a].ts);
      if(keys.length > RESULTS_CACHE_MAX){
        keys.slice(RESULTS_CACHE_MAX).forEach(k => delete cache[k]);
      }
      localStorage.setItem(RESULTS_CACHE_KEY, JSON.stringify(cache));
    }catch(e){ /* تجاهل لو التخزين ممتلئ */ }
  }

  function getResultFromCache(term){
    const cache = loadResultsCache();
    return cache[term] || null;
  }

  function fileIconLabel(){ return 'PDF'; }

  // بيقسّم كلمة البحث لكذا كلمة (على المسافات) ويطلب إن كل كلمة تكون موجودة
  // في اسم الملف (مش لازم بنفس الترتيب) - بيساعد في حالات زي "1234 اوردر"
  // أو لما اسم الملف يكون order_1234.pdf وحد كتب "1234" لوحدها
  function buildNameQuery(term){
    const words = term.split(/\s+/).filter(Boolean);
    return words.map(w => `name contains '${escapeForDriveQuery(w)}'`).join(' and ');
  }

  let currentFiles = [];
  let renderedCount = 0;

  function showResultsPage(files, append){
    if(!append){
      resultsEl.innerHTML = "";
      displayedCount = 0;
      currentFiles = files;
      renderedCount = 0;
    }
    const nextBatch = currentFiles.slice(renderedCount, renderedCount + PAGE_SIZE);
    renderFiles(nextBatch);
    renderedCount += nextBatch.length;

    const remaining = currentFiles.length - renderedCount;
    if(remaining > 0){
      loadMoreBtn.style.display = "block";
      loadMoreBtn.textContent = `تحميل المزيد (${remaining} باقي)`;
    } else {
      loadMoreBtn.style.display = "none";
    }
  }

  function renderFiles(files){
    files.forEach(f => {
      const a = document.createElement('a');
      a.className = 'result-item';
      // رابط تحميل مباشر (مش معاينة درايف) عشان يفتح بتطبيق PDF مثبت على الجهاز
      a.href = `https://drive.google.com/uc?export=download&id=${f.id}`;
      a.innerHTML = `
        <div class="file-icon">${fileIconLabel()}</div>
        <div class="file-name">${f.name}</div>
      `;
      resultsEl.appendChild(a);
      displayedCount++;
    });
  }

  // بيدور في كل فولدر لوحده بشكل منفصل ومتوازي (مش OR مجمّع) لأن Drive API
  // بيرجع خطأ صلاحيات وهمي لما تجمع أكتر من فولدر في نفس الاستعلام
  const CONCURRENCY = 8;

  async function searchFolderSingle(folderId, nameQuery){
    const q = `'${folderId}' in parents and mimeType = 'application/pdf' and trashed = false and ${nameQuery}`;
    try{
      const data = await driveList(q, null);
      return data.files || [];
    }catch(err){
      return []; // فولدر مش متاح - نتجاهله
    }
  }

  async function searchAllFolders(folderIds, nameQuery){
    let results = [];
    const queue = folderIds.slice();
    async function worker(){
      while(queue.length){
        const folderId = queue.shift();
        const files = await searchFolderSingle(folderId, nameQuery);
        if(files.length) results = results.concat(files);
      }
    }
    const workers = [];
    for(let i=0;i<CONCURRENCY;i++) workers.push(worker());
    await Promise.all(workers);
    return results;
  }

  async function runSearch(){
    const term = qInput.value.trim();
    cacheNoteEl.style.display = "none";

    if(!term){
      setLoading(false);
      setStatus("اكتب اسم أو جزء من اسم الملف الأول");
      resultsEl.innerHTML = "";
      return;
    }
    if(!checkSetup()) return;

    const myToken = ++searchToken; // عشان لو المستخدم كتب أسرع من رد السيرفر، نتجاهل الرد القديم

    const folderIds = await ensureIndex(false);
    if(!folderIds) return;
    if(myToken !== searchToken) return; // بحث أحدث بدأ فعلاً

    // لو النتيجة دي متخزنة من قبل، اعرضها فورًا من غير ما تستنى الشبكة
    const cached = getResultFromCache(term);
    if(cached){
      showResultsPage(cached.files, false);
      setStatus(cached.files.length ? `تم إيجاد ${cached.files.length} نتيجة` : "مفيش نتايج مطابقة");
      cacheNoteEl.style.display = "block";
      cacheNoteEl.textContent = "⚡ نتيجة سريعة من آخر بحث محفوظ، بيتم التحديث في الخلفية...";
    } else {
      resultsEl.innerHTML = "";
      displayedCount = 0;
      currentFiles = [];
      renderedCount = 0;
      loadMoreBtn.style.display = "none";
      setStatus("بحث جاري...");
    }

    setLoading(true);
    try{
      const nameQuery = buildNameQuery(term);
      const files = await searchAllFolders(folderIds, nameQuery);

      if(myToken !== searchToken) return; // اتلغى لأن المستخدم بحث عن حاجة تانية

      showResultsPage(files, false);
      setStatus(files.length ? `تم إيجاد ${files.length} نتيجة` : "مفيش نتايج مطابقة");
      cacheNoteEl.style.display = "none";
      saveResultToCache(term, files);
    }catch(err){
      if(myToken !== searchToken) return;
      if(!cached) setStatus("حصل خطأ: " + err.message);
    }finally{
      if(myToken === searchToken) setLoading(false);
    }
  }

  function scheduleSearch(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, DEBOUNCE_MS);
  }

  searchBtn.addEventListener('click', () => { clearTimeout(debounceTimer); runSearch(); });
  qInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ clearTimeout(debounceTimer); runSearch(); }
  });
  qInput.addEventListener('input', () => {
    if(qInput.value.trim() === ""){
      clearTimeout(debounceTimer);
      resultsEl.innerHTML = "";
      currentFiles = [];
      renderedCount = 0;
      loadMoreBtn.style.display = "none";
      cacheNoteEl.style.display = "none";
      setStatus("");
      return;
    }
    scheduleSearch();
  });

  loadMoreBtn.addEventListener('click', () => {
    showResultsPage(currentFiles, true);
  });

  refreshIndexBtn.addEventListener('click', async () => {
    refreshIndexBtn.disabled = true;
    resultsEl.innerHTML = "";
    await ensureIndex(true); // forceRefresh = true
    refreshIndexBtn.disabled = false;
  });

  checkSetup();
  // أول ما الصفحة تفتح: استخدم الفهرس المحفوظ لو موجود، من غير إعادة فهرسة تلقائية
  ensureIndex(false);

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
</script>
</body>
</html>
