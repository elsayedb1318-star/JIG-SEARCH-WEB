<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIG SEARCH</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a56db">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --blue:#1a56db;
    --blue-dark:#1442a8;
    --bg:#eef1f6;
    --card:#ffffff;
    --border:#d9dee6;
    --text:#1f2430;
    --muted:#6b7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .header{
    width:100%;
    background:var(--card);
    padding:36px 20px 28px;
    box-shadow:0 2px 10px rgba(20,30,60,.06);
    border-bottom-left-radius:28px;
    border-bottom-right-radius:28px;
  }
  .title{
    text-align:center;
    font-size:32px;
    font-weight:800;
    letter-spacing:1px;
    color:var(--blue);
    margin:0 0 24px;
    font-family:Tahoma, Arial, sans-serif;
  }
  .search-box{
    max-width:520px;
    margin:0 auto;
  }
  input#q{
    width:100%;
    padding:16px 18px;
    font-size:16px;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    background:#fff;
    text-align:right;
  }
  input#q:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(26,86,219,.15);
  }
  button#searchBtn{
    width:100%;
    margin-top:14px;
    padding:16px;
    font-size:18px;
    font-weight:600;
    color:#fff;
    background:var(--blue);
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:background .15s ease;
  }
  button#searchBtn:hover{ background:var(--blue-dark); }
  button#searchBtn:disabled{ background:#9db4e8; cursor:default; }
  .powered{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-top:16px;
  }
  .refresh-index-btn{
    display:block;
    margin:14px auto 0;
    padding:8px 18px;
    background:#fff;
    border:1px solid var(--border);
    color:var(--blue);
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
  }
  .refresh-index-btn:hover{ border-color:var(--blue); }
  .refresh-index-btn:disabled{ opacity:.6; cursor:default; }
  .content{
    width:100%;
    max-width:640px;
    padding:22px 16px 60px;
  }
  .status{
    text-align:center;
    color:var(--muted);
    margin-top:24px;
    font-size:15px;
  }
  .results{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:8px;
  }
  .result-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    text-decoration:none;
    color:var(--text);
  }
  .result-item:hover{ border-color:var(--blue); }
  .file-icon{
    flex:0 0 auto;
    width:36px;height:36px;
    border-radius:8px;
    background:#fde8e8;
    color:#c0392b;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
  }
  .file-name{
    flex:1;
    font-size:15px;
    word-break:break-word;
    text-align:right;
  }
  .load-more{
    display:block;
    margin:16px auto 0;
    padding:10px 22px;
    background:#fff;
    border:1px solid var(--blue);
    color:var(--blue);
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
  }
  .setup-warning{
    max-width:640px;
    margin:18px auto 0;
    background:#fff7e6;
    border:1px solid #ffd591;
    color:#8a5b00;
    border-radius:10px;
    padding:14px 16px;
    font-size:13.5px;
    line-height:1.7;
    text-align:right;
  }
  .setup-warning code{
    background:#fff1d1;
    padding:1px 5px;
    border-radius:4px;
    direction:ltr;
    unicode-bidi:embed;
  }
  .status{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .spinner{
    display:none;
    width:18px;
    height:18px;
    border:3px solid #c9d4e8;
    border-top-color:var(--blue);
    border-radius:50%;
    animation:spin .7s linear infinite;
    flex:0 0 auto;
  }
  .spinner.active{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .cache-note{
    text-align:center;
    color:#9aa3b2;
    font-size:12.5px;
    margin-top:-4px;
    margin-bottom:8px;
  }
</style>
</head>
<body>

  <div class="header">
    <h1 class="title">JIG SEARCH</h1>
    <div class="search-box">
      <input type="text" id="q" placeholder="connector or order number" />
      <button id="searchBtn">بحث</button>
    </div>
    <div class="powered">Powered by Elsayed adel</div>
    <button id="refreshIndexBtn" class="refresh-index-btn">🔄 اضغط لتحديث بيانات الملفات</button>
  </div>

  <div class="content">
    <div id="setupWarning" class="setup-warning" style="display:none;"></div>
    <div id="status" class="status">
      <span id="spinner" class="spinner"></span>
      <span id="statusText"></span>
    </div>
    <div id="results" class="results"></div>
    <button id="loadMoreBtn" class="load-more" style="display:none;">تحميل المزيد</button>
  </div>

<script>
  // =========================================================
  // إعدادات لازم تتظبط قبل ما الصفحة تشتغل:
  // =========================================================
  const API_KEY = "AIzaSyC7F7fO9WYl7Qzt0Zl45Mk04XlZuoOJ4uo"; // <-- حط الـ API Key هنا
  const ROOT_FOLDER_ID = "1m0jhTeU8PtiaFu9G_mzH_NxLD-IayaR-"; // ID الفولدر الرئيسي
  const PAGE_SIZE = 30;
  const CACHE_KEY = 'jigsearch_index_v3'; // شامل الفولدرات + أسماء كل ملفات الـ PDF
  const DEBOUNCE_MS = 550;
  // ملحوظة: مفيش وقت انتهاء صلاحية للفهرس دلوقتي.
  // الفهرسة (فولدرات + أسماء ملفات) بتتم مرة واحدة وتتخزن، وتتحدث بس
  // لما تدوس زرار "تحديث الفهرس" يدويًا. البحث بعد كده بيتم محليًا على
  // الفهرس المخزن من غير أي طلبات إضافية لـ Google Drive.
  // =========================================================

  const qInput = document.getElementById('q');
  const searchBtn = document.getElementById('searchBtn');
  const statusEl = document.getElementById('statusText');
  const spinnerEl = document.getElementById('spinner');
  const resultsEl = document.getElementById('results');
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const setupWarning = document.getElementById('setupWarning');
  const refreshIndexBtn = document.getElementById('refreshIndexBtn');

  let allFolderIds = null;   // كل الفولدرات (شامل الرئيسي) بعد الفهرسة
  let indexedFiles = null;   // كل ملفات الـ PDF (id + name) اللي اتفهرست جوه كل الفولدرات
  let displayedCount = 0;
  let debounceTimer = null;
  let searchToken = 0; // بيتزود كل بحث جديد عشان نلغي نتيجة بحث قديم اتأخر

  function setLoading(isLoading){
    spinnerEl.classList.toggle('active', !!isLoading);
    searchBtn.disabled = !!isLoading;
  }

  function setStatus(text){
    statusEl.textContent = text || "";
  }

  function checkSetup(){
    if(!API_KEY || API_KEY === "YOUR_GOOGLE_API_KEY_HERE"){
      setupWarning.style.display = "block";
      setupWarning.innerHTML =
        "⚠️ لسه محتاج تحط الـ Google API Key عشان البحث يشتغل.<br>" +
        "افتح ملف الصفحة، دوّر على المتغيّر <code>API_KEY</code>، وحطّ فيه الكود من Google Cloud Console.<br>" +
        "وتأكد إن الفولدر معمول له مشاركة \"Anyone with the link – Viewer\".";
      searchBtn.disabled = true;
      return false;
    }
    setupWarning.style.display = "none";
    return true;
  }

  async function driveList(q, pageToken){
    const url = new URL('https://www.googleapis.com/drive/v3/files');
    url.searchParams.set('q', q);
    url.searchParams.set('fields', 'nextPageToken, files(id, name, webViewLink, mimeType)');
    url.searchParams.set('pageSize', '1000');
    url.searchParams.set('key', API_KEY);
    url.searchParams.set('supportsAllDrives', 'true');
    url.searchParams.set('includeItemsFromAllDrives', 'true');
    if(pageToken) url.searchParams.set('pageToken', pageToken);
    const res = await fetch(url.toString());
    const data = await res.json();
    if(data.error) throw new Error(data.error.message || 'خطأ غير معروف من Google Drive');
    return data;
  }

  let skippedFolderCount = 0;

  // بيدور على كل الفولدرات الفرعية جوه فولدر معين (BFS من كل المستويات)،
  // وفي نفس الوقت بيجمع أسماء كل ملفات الـ PDF جوه كل فولدر (استعلام واحد
  // لكل فولدر بيرجع الفولدرات والملفات مع بعض بدل استعلامين منفصلين).
  // لو فولدر معين مش عنده صلاحية وصول، بيتخطاه ويكمل الباقي بدل ما يوقف.
  async function crawlAllFoldersAndFiles(rootId, onProgress){
    const folderIds = [rootId];
    const files = [];
    let queue = [rootId];
    let level = 0;
    while(queue.length){
      const nextQueue = [];
      for(const folderId of queue){
        let pageToken = null;
        let keepGoing = true;
        while(keepGoing){
          try{
            const q = `'${folderId}' in parents and trashed = false`;
            const data = await driveList(q, pageToken);
            (data.files || []).forEach(f => {
              if(f.mimeType === 'application/vnd.google-apps.folder'){
                folderIds.push(f.id);
                nextQueue.push(f.id);
              } else if(f.mimeType === 'application/pdf'){
                files.push({ id: f.id, name: f.name });
              }
            });
            pageToken = data.nextPageToken || null;
            keepGoing = !!pageToken;
          }catch(err){
            // فولدر مش متاح الوصول له (صلاحيات، أو Shortcut معطوب) - نتخطاه ونكمل
            skippedFolderCount++;
            keepGoing = false;
          }
        }
      }
      queue = nextQueue;
      level++;
      if(onProgress) onProgress(folderIds.length, files.length, level);
      if(level > 15) break; // حماية من حلقات لا نهائية
    }
    return { folderIds, files };
  }

  function loadCachedIndex(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(parsed.rootId !== ROOT_FOLDER_ID) return null;
      if(!parsed.folderIds || !parsed.files) return null;
      return parsed;
    }catch(e){ return null; }
  }

  function saveCachedIndex(folderIds, files){
    try{
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        rootId: ROOT_FOLDER_ID, ts: Date.now(), folderIds, files
      }));
    }catch(e){ /* تجاهل لو التخزين ممتلئ */ }
  }

  // بيرجع true لو الفهرس (فولدرات + ملفات) جاهز في الميموري.
  // ملحوظة: مفيش فهرسة تلقائية أول مرة - لو مفيش فهرس محفوظ، بيطلب من
  // المستخدم يدوس زرار "اضغط لتحديث بيانات الملفات" بنفسه.
  async function ensureIndex(forceRefresh){
    if(allFolderIds && indexedFiles && !forceRefresh) return true;

    if(!forceRefresh){
      const cached = loadCachedIndex();
      if(cached){
        allFolderIds = cached.folderIds;
        indexedFiles = cached.files;
        setStatus(`(من الفهرس المخزن) ${allFolderIds.length} فولدر و ${indexedFiles.length} ملف PDF. اكتب كلمة البحث.`);
        return true;
      }
      // مفيش فهرس محفوظ ومفيش طلب تحديث صريح - منعملش فهرسة تلقائية
      setStatus('لسه مفيش بيانات محفوظة. دوس زرار "اضغط لتحديث بيانات الملفات" فوق الأول.');
      return false;
    }

    setStatus("بيتم تجهيز فهرس الفولدرات والملفات... (هيتم مرة واحدة بس ويتخزن)");
    setLoading(true);
    try{
      skippedFolderCount = 0;
      const result = await crawlAllFoldersAndFiles(ROOT_FOLDER_ID, (folderCount, fileCount, level) => {
        setStatus(`بيتم الفهرسة... ${folderCount} فولدر و ${fileCount} ملف PDF لحد دلوقتي (مستوى ${level})`);
      });
      allFolderIds = result.folderIds;
      indexedFiles = result.files;
      saveCachedIndex(allFolderIds, indexedFiles);
      setStatus(`تم فهرسة ${allFolderIds.length} فولدر و ${indexedFiles.length} ملف PDF${skippedFolderCount ? ` (اتخطى ${skippedFolderCount} فولدر ملوش صلاحية وصول)` : ''}. اكتب كلمة البحث.`);
    }catch(err){
      setStatus("حصل خطأ أثناء الفهرسة: " + err.message);
      allFolderIds = null;
      indexedFiles = null;
    }finally{
      setLoading(false);
    }
    return !!(allFolderIds && indexedFiles);
  }

  function fileIconLabel(){ return 'PDF'; }

  // بيقسّم كلمة البحث لكذا كلمة (على المسافات) - كل كلمة لازم تكون
  // موجودة في أي مكان جوه اسم الملف (substring حقيقي)، مش لازم بنفس الترتيب
  function splitSearchWords(term){
    return term.split(/\s+/).filter(Boolean).map(w => w.toLowerCase());
  }

  // مطابقة substring حقيقية على الاسم الكامل، عشان بحث زي "549" يلاقي
  // ملف اسمه "19005492" حتى لو الرقم مش في أول أو آخر الاسم
  function matchesAllWords(fileName, words){
    const name = fileName.toLowerCase();
    return words.every(w => name.includes(w));
  }

  let currentFiles = [];
  let renderedCount = 0;

  function showResultsPage(files, append){
    if(!append){
      resultsEl.innerHTML = "";
      displayedCount = 0;
      currentFiles = files;
      renderedCount = 0;
    }
    const nextBatch = currentFiles.slice(renderedCount, renderedCount + PAGE_SIZE);
    renderFiles(nextBatch);
    renderedCount += nextBatch.length;

    const remaining = currentFiles.length - renderedCount;
    if(remaining > 0){
      loadMoreBtn.style.display = "block";
      loadMoreBtn.textContent = `تحميل المزيد (${remaining} باقي)`;
    } else {
      loadMoreBtn.style.display = "none";
    }
  }

  function renderFiles(files){
    files.forEach(f => {
      const a = document.createElement('a');
      a.className = 'result-item';
      // رابط تحميل مباشر (مش معاينة درايف) عشان يفتح بتطبيق PDF مثبت على الجهاز
      a.href = `https://drive.google.com/uc?export=download&id=${f.id}`;
      a.innerHTML = `
        <div class="file-icon">${fileIconLabel()}</div>
        <div class="file-name">${f.name}</div>
      `;
      resultsEl.appendChild(a);
      displayedCount++;
    });
  }

  // البحث بيتم بالكامل محليًا على الفهرس المخزن (allFolderIds + indexedFiles)
  // من غير أي طلبات جديدة لـ Google Drive - أسرع بكتير ومش بيستهلك quota الـ API
  async function runSearch(){
    const term = qInput.value.trim();

    if(!term){
      setStatus("اكتب اسم أو جزء من اسم الملف الأول");
      resultsEl.innerHTML = "";
      currentFiles = [];
      renderedCount = 0;
      loadMoreBtn.style.display = "none";
      return;
    }
    if(!checkSetup()) return;

    const myToken = ++searchToken; // عشان لو المستخدم كتب أسرع من رد الفهرسة، نتجاهل النتيجة القديمة

    const ready = await ensureIndex(false);
    if(!ready) return;
    if(myToken !== searchToken) return; // بحث أحدث بدأ فعلاً

    const words = splitSearchWords(term);
    const matched = indexedFiles.filter(f => matchesAllWords(f.name, words));

    showResultsPage(matched, false);
    setStatus(matched.length ? `تم إيجاد ${matched.length} نتيجة` : "مفيش نتايج مطابقة");
  }

  function scheduleSearch(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, DEBOUNCE_MS);
  }

  searchBtn.addEventListener('click', () => { clearTimeout(debounceTimer); runSearch(); });
  qInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ clearTimeout(debounceTimer); runSearch(); }
  });
  qInput.addEventListener('input', () => {
    if(qInput.value.trim() === ""){
      clearTimeout(debounceTimer);
      resultsEl.innerHTML = "";
      currentFiles = [];
      renderedCount = 0;
      loadMoreBtn.style.display = "none";
      setStatus("");
      return;
    }
    scheduleSearch();
  });

  loadMoreBtn.addEventListener('click', () => {
    showResultsPage(currentFiles, true);
  });

  refreshIndexBtn.addEventListener('click', async () => {
    refreshIndexBtn.disabled = true;
    resultsEl.innerHTML = "";
    currentFiles = [];
    renderedCount = 0;
    loadMoreBtn.style.display = "none";
    await ensureIndex(true); // forceRefresh = true
    refreshIndexBtn.disabled = false;
  });

  checkSetup();
  // أول ما الصفحة تفتح: استخدم الفهرس المحفوظ لو موجود، من غير إعادة فهرسة تلقائية
  ensureIndex(false);

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
</script>
</body>
</html>
